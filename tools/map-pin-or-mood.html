<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>景點心情分艙｜ChillOut 旅行小工具 T006</title>
  <meta name="description" content="把一堆景點依心情分成興奮、放空、拍照、吃喝四艙，輸出每天主旋律與 ChillOut prompt。">
  <meta property="og:title" content="景點心情分艙">
  <meta property="og:description" content="不要先照地圖排。先把景點按心情分艙，再讓 ChillOut 排成每天節奏。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/map-pin-or-mood.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/map-pin-or-mood.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/map-pin-or-mood.html">
  <link rel="stylesheet" href="../assets/mood-cabin.css?v=20260525simple">
</head>
<body class="mood-cabin-app">
  <header class="mc-nav">
    <a class="mc-brand" href="../travel-microtools-100.html">
      <span class="mc-mark">C</span>
      <span><strong>ChillOut</strong><small>T006 景點心情分艙</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_mood_cabin_nav">下載 App</a>
    </nav>
  </header>

  <main class="mc-page">
    <section class="mc-hero">
      <p class="mc-kicker">T006 · Mood first, map second</p>
      <h1>先分心情，再排行程。</h1>
      <p>貼上景點清單，每次只看一個點，把它丟進「興奮、放空、拍照、吃喝」其中一艙。最後輸出每天主旋律，讓 ChillOut 接手排路線。</p>
    </section>

    <section class="mc-loader" aria-label="景點輸入">
      <label>
        <span>景點清單</span>
        <textarea data-list placeholder="每行一個景點，例如：聖水洞咖啡街"></textarea>
      </label>
      <div class="mc-loader-actions">
        <label>
          <span>旅行天數</span>
          <select data-days>
            <option>2</option>
            <option selected>3</option>
            <option>4</option>
          </select>
        </label>
        <button class="mc-button" data-sample>載入示範</button>
        <button class="mc-button primary" data-start>開始分艙</button>
      </div>
    </section>

    <section class="mc-workspace">
      <section class="mc-current" data-current></section>
      <section class="mc-output" data-output></section>
    </section>
  </main>

  <div class="mc-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/mood-cabin.js?v=20260525simple"></script>
</body>
</html>
