<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行搭子合約｜ChillOut 旅行小工具 T021</title>
  <meta name="description" content="出發前整理旅伴名單、預算、作息、拍照、放風、決策權與分帳方式，產生可截圖旅行搭子合約。">
  <meta property="og:title" content="旅行搭子合約｜ChillOut">
  <meta property="og:description" content="好旅伴不是不吵架，是有事先說清楚。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/travel-buddy-contract.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/travel-buddy-contract.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/travel-buddy-contract.html">
  <link rel="stylesheet" href="../assets/travel-buddy-contract.css?v=20260525manual1">
</head>
<body class="contract-app">
  <header class="bc-topbar">
    <a class="bc-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="bc-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T021 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_travel_buddy_contract_nav">下載 App</a>
    </nav>
  </header>

  <main class="bc-page">
    <section class="bc-hero">
      <p class="bc-eyebrow">Travel buddy pact</p>
      <h1>好旅伴不是不吵架，是有事先說清楚。</h1>
      <p>把出發前最容易裝沒事、途中最容易爆炸的點先寫下來。這不是法律文件，是一張可以丟群組確認的旅行共識卡。</p>
    </section>

    <section class="bc-tool" aria-label="旅行搭子合約操作區">
      <form class="bc-form" data-form>
        <label class="bc-field">
          <span>旅伴名單</span>
          <input data-people value="我、阿哲、小雨、Mia" autocomplete="off">
        </label>

        <div class="bc-grid">
          <label class="bc-field">
            <span>預算差距</span>
            <select data-budget>
              <option value="same">很一致</option>
              <option value="some" selected>有一點落差</option>
              <option value="large">落差很大</option>
            </select>
          </label>
          <label class="bc-field">
            <span>起床時間</span>
            <select data-wake>
              <option value="early">早起派</option>
              <option value="normal" selected>正常出門</option>
              <option value="late">睡飽再說</option>
            </select>
          </label>
        </div>

        <div class="bc-grid">
          <label class="bc-field">
            <span>吃飯策略</span>
            <select data-food>
              <option value="budget">省錢為主</option>
              <option value="balanced" selected>正常吃</option>
              <option value="splurge">想吃好一點</option>
            </select>
          </label>
          <label class="bc-field">
            <span>分帳方式</span>
            <select data-split>
              <option value="equal" selected>平均分</option>
              <option value="each">各付各的</option>
              <option value="record">先記帳再結算</option>
            </select>
          </label>
        </div>

        <label class="bc-range">
          <span>拍照耐心 <strong data-value="photo">55</strong></span>
          <input data-photo type="range" min="0" max="100" value="55">
        </label>
        <label class="bc-range">
          <span>各自放風需求 <strong data-value="alone">64</strong></span>
          <input data-alone type="range" min="0" max="100" value="64">
        </label>

        <div class="bc-grid">
          <label class="bc-field">
            <span>最後決策權</span>
            <select data-decision>
              <option value="vote" selected>投票</option>
              <option value="owner">交給今日主揪</option>
              <option value="rotate">每日輪流</option>
            </select>
          </label>
          <label class="bc-field">
            <span>最大雷點</span>
            <select data-conflict>
              <option value="late">有人遲到</option>
              <option value="money" selected>錢講不清楚</option>
              <option value="photo">拍照拖太久</option>
              <option value="solo">有人想放風</option>
            </select>
          </label>
        </div>

        <div class="bc-actions">
          <button class="bc-button" type="button" data-sample>載入示範</button>
          <button class="bc-button bc-primary" type="submit">產生合約</button>
        </div>
      </form>

      <section class="bc-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="bc-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/travel-buddy-contract.js?v=20260525manual1"></script>
</body>
</html>
