<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IG 靈感急救室｜ChillOut 旅行小工具 T001</title>
  <meta name="description" content="貼上 IG 收藏清單，30 秒整理成一條簡單可出發的第一版路線，並產生 ChillOut prompt。">
  <meta property="og:title" content="IG 靈感急救室">
  <meta property="og:description" content="貼上收藏，得到一條先出發再微調的旅行路線。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/save-sprint.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/save-sprint.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/save-sprint.html">
  <link rel="stylesheet" href="../assets/save-sprint.css?v=20260525simple">
</head>
<body class="save-sprint-app">
  <header class="ss-nav">
    <a class="ss-brand" href="../travel-microtools-100.html">
      <span class="ss-mark">C</span>
      <span><strong>ChillOut</strong><small>T001 IG 靈感急救室</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_save_sprint_nav">下載 App</a>
    </nav>
  </header>

  <main class="ss-page">
    <section class="ss-hero">
      <div>
        <p class="ss-kicker">T001 · One clear route</p>
        <h1>把 IG 收藏變成一條路線。</h1>
        <p>不用整理成大表格。貼上你收藏的店名或景點，它會直接挑出一條「今天可以先走」的路線，剩下的放備用。</p>
      </div>
      <aside class="ss-quick">
        <strong data-count>0</strong>
        <span>個收藏已整理</span>
      </aside>
    </section>

    <section class="ss-tool">
      <section class="ss-card">
        <h2>1. 貼上收藏</h2>
        <p class="ss-help">每行一個景點或店名。你也可以先載入示範。</p>
        <label class="ss-field">
          <span>收藏清單</span>
          <textarea data-places placeholder="例如：弘大 rooftop bar 晚上拍照"></textarea>
        </label>
        <div class="ss-row">
          <label class="ss-field">
            <span>目的地</span>
            <input data-city value="首爾">
          </label>
          <label class="ss-field">
            <span>旅行感覺</span>
            <select data-mood>
              <option>好拍</option>
              <option>美食</option>
              <option>放空</option>
              <option>在地</option>
            </select>
          </label>
        </div>
        <div class="ss-actions">
          <button class="ss-button" data-sample>載入示範</button>
          <button class="ss-button primary" data-generate>2. 產生路線</button>
        </div>
      </section>

      <section class="ss-result" data-result></section>
    </section>
  </main>

  <div class="ss-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/save-sprint.js?v=20260525simple"></script>
</body>
</html>
