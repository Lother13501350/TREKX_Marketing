<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IG 收藏急救室｜ChillOut 旅行小工具 T001</title>
  <meta name="description" content="把 IG 收藏、店名、景點與 Reels 靈感整理成今天可走的第一版路線，並產生可直接丟進 ChillOut 的行程 prompt。">
  <meta property="og:title" content="IG 收藏急救室｜ChillOut">
  <meta property="og:description" content="貼上收藏清單，30 秒整理成一條今天可走的路線。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/save-sprint.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/save-sprint.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/save-sprint.html">
  <link rel="stylesheet" href="../assets/save-sprint.css?v=20260525manual2">
</head>
<body class="save-sprint-app">
  <header class="ss-topbar">
    <a class="ss-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="ss-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T001 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_save_sprint_nav">下載 App</a>
    </nav>
  </header>

  <main class="ss-shell">
    <section class="ss-hero">
      <p class="ss-eyebrow">IG saved posts cleaner</p>
      <h1>把一坨 IG 收藏，變成今天真的能走的路線。</h1>
      <p>不用整理成表格。貼上你存起來的店名、景點、Reels 標題或朋友丟來的清單，工具會幫你分出「必排、備用、先刪」，再產生 ChillOut 可以接手的 prompt。</p>
    </section>

    <section class="ss-board" aria-label="IG 收藏急救室操作區">
      <form class="ss-input-card" data-form>
        <div class="ss-card-head">
          <span>01</span>
          <div>
            <h2>倒進你的收藏</h2>
            <p>一行一個地點，越亂越適合。</p>
          </div>
        </div>

        <label class="ss-field">
          <span>收藏清單</span>
          <textarea data-places spellcheck="false" placeholder="例：延南洞咖啡廳&#10;景福宮韓服拍照&#10;弘大 rooftop bar&#10;廣藏市場晚餐"></textarea>
        </label>

        <div class="ss-split">
          <label class="ss-field">
            <span>目的地</span>
            <input data-city value="首爾" autocomplete="off">
          </label>
          <label class="ss-field">
            <span>今天想要的感覺</span>
            <select data-mood>
              <option value="好拍">好拍</option>
              <option value="美食">美食</option>
              <option value="放空">放空</option>
              <option value="在地">在地</option>
            </select>
          </label>
        </div>

        <fieldset class="ss-fieldset">
          <legend>整理嚴格度</legend>
          <div class="ss-choice-row" data-strictness>
            <button type="button" data-value="loose">寬鬆</button>
            <button type="button" data-value="balanced" class="is-active">剛剛好</button>
            <button type="button" data-value="sharp">狠一點</button>
          </div>
        </fieldset>

        <div class="ss-actions">
          <button type="button" class="ss-button" data-sample>載入示範</button>
          <button type="submit" class="ss-button ss-primary">整理收藏</button>
        </div>
      </form>

      <section class="ss-result-card" data-result aria-live="polite">
        <div class="ss-empty">
          <span>02</span>
          <h2>等你貼上收藏</h2>
          <p>這裡會產生一條最小可出發路線、三桶分類、分享文案與 ChillOut prompt。</p>
        </div>
      </section>
    </section>
  </main>

  <div class="ss-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/save-sprint.js?v=20260525manual2"></script>
</body>
</html>
