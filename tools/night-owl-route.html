<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜貓城市路線｜ChillOut 旅行小工具 T031</title>
  <meta name="description" content="輸入城市、出門時間、最晚回程、安全保守度與夜晚候選點，生成晚餐後、主夜景、宵夜返程三段夜遊路線與 ChillOut prompt。">
  <meta property="og:title" content="夜貓城市路線｜ChillOut">
  <meta property="og:description" content="有些城市要等天黑才真正開始，但夜遊要先排安全返程。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/night-owl-route.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/night-owl-route.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/night-owl-route.html">
  <link rel="stylesheet" href="../assets/night-owl-route.css?v=20260525manual1">
</head>
<body class="nr-app">
  <header class="nr-topbar">
    <a class="nr-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="nr-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T031 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_night_owl_route_nav">下載 App</a>
    </nav>
  </header>

  <main class="nr-page">
    <section class="nr-hero">
      <p class="nr-eyebrow">Noctourism route</p>
      <h1>夜遊不是熬夜，是把城市晚上的節奏排好。</h1>
      <p>夜景、宵夜、深夜散步都很迷人，但安全返程比浪漫更早決定。這個工具把城市、時段、候選點與安全保守度整理成三段式夜遊路線。</p>
    </section>

    <section class="nr-layout" aria-label="夜貓城市路線操作區">
      <aside class="nr-panel nr-settings">
        <form data-night-form>
          <label class="nr-field">
            <span>城市</span>
            <input data-city value="首爾" autocomplete="off">
          </label>
          <div class="nr-two">
            <label class="nr-field">
              <span>出門時間</span>
              <select data-start>
                <option value="18:30">18:30</option>
                <option value="19:30" selected>19:30</option>
                <option value="20:30">20:30</option>
              </select>
            </label>
            <label class="nr-field">
              <span>最晚回程</span>
              <select data-return>
                <option value="22:30">22:30</option>
                <option value="23:30" selected>23:30</option>
                <option value="00:30">00:30</option>
              </select>
            </label>
          </div>
          <label class="nr-range">
            <span>安全保守度 <strong data-safety-value>74</strong></span>
            <input data-safety type="range" min="0" max="100" value="74">
          </label>
          <div class="nr-actions">
            <button type="button" class="nr-button" data-sample>載入示範</button>
            <button type="button" class="nr-button" data-add-stop>加夜點</button>
          </div>
        </form>
      </aside>

      <section class="nr-panel nr-stops">
        <div class="nr-section-head">
          <div>
            <p class="nr-eyebrow">Night stops</p>
            <h2>夜晚候選點</h2>
          </div>
          <button type="button" class="nr-button nr-primary" data-generate>生成夜遊路線</button>
        </div>
        <div class="nr-stop-list" data-stops></div>
      </section>

      <section class="nr-panel nr-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="nr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/night-owl-route.js?v=20260525manual1"></script>
</body>
</html>
