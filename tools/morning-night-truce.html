<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>早鳥夜貓停戰協議｜ChillOut 旅行小工具 T028</title>
  <meta name="description" content="輸入旅伴起床時間、早晨精神、夜間精神與必做項目，生成早鳥線、共同核心時段、夜貓線、集合點規則與 ChillOut prompt。">
  <meta property="og:title" content="早鳥夜貓停戰協議｜ChillOut">
  <meta property="og:description" content="不必同時起床，也可以一起旅行。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/morning-night-truce.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/morning-night-truce.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/morning-night-truce.html">
  <link rel="stylesheet" href="../assets/morning-night-truce.css?v=20260525manual1">
</head>
<body class="mt-app">
  <header class="mt-topbar">
    <a class="mt-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="mt-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T028 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_morning_night_truce_nav">下載 App</a>
    </nav>
  </header>

  <main class="mt-page">
    <section class="mt-hero">
      <p class="mt-eyebrow">Morning night truce</p>
      <h1>早起派和夜貓派，不必互相折磨。</h1>
      <p>有人想 8 點出門，有人 11 點才像人。這個工具把起床時間、早晨精神、夜間精神與必做項目拆開，幫旅伴安排分流時段與真正需要一起出現的核心時間。</p>
    </section>

    <section class="mt-layout" aria-label="早鳥夜貓停戰協議操作區">
      <aside class="mt-panel mt-settings">
        <form data-plan-form>
          <label class="mt-field">
            <span>旅行日</span>
            <input data-trip value="京都第二天" autocomplete="off">
          </label>
          <label class="mt-field">
            <span>集合策略</span>
            <select data-policy>
              <option value="core" selected>只強制共同核心時段</option>
              <option value="breakfast">早餐後集合</option>
              <option value="dinner">晚餐一定一起</option>
            </select>
          </label>
          <label class="mt-range">
            <span>遲到容忍度 <strong data-late-value>36</strong></span>
            <input data-late type="range" min="0" max="100" value="36">
          </label>
          <div class="mt-actions">
            <button type="button" class="mt-button" data-sample>載入示範</button>
            <button type="button" class="mt-button" data-add-person>加旅伴</button>
            <button type="button" class="mt-button" data-add-wish>加必做</button>
          </div>
        </form>
      </aside>

      <section class="mt-panel mt-people">
        <div class="mt-section-head">
          <div>
            <p class="mt-eyebrow">People</p>
            <h2>作息能量</h2>
          </div>
        </div>
        <div class="mt-people-list" data-people></div>
      </section>

      <section class="mt-panel mt-wishes">
        <div class="mt-section-head">
          <div>
            <p class="mt-eyebrow">Must do</p>
            <h2>一定想做的事</h2>
          </div>
          <button type="button" class="mt-button mt-primary" data-generate>生成停戰協議</button>
        </div>
        <div class="mt-wish-list" data-wishes></div>
      </section>

      <section class="mt-panel mt-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="mt-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/morning-night-truce.js?v=20260525manual1"></script>
</body>
</html>
