<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2 公里支線任務｜ChillOut 旅行小工具 T043</title>
  <meta name="description" content="在主要景點旁邊找一個 2 公里內的小冒險。輸入主景點、可用時間、步行上限、體力與候選支線，生成可執行支線任務與 ChillOut prompt。">
  <meta property="og:title" content="2 公里支線任務｜ChillOut 旅行小工具 T043">
  <meta property="og:description" content="最有記憶點的常常是支線。在主要景點旁邊多找一個驚喜。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/two-km-sidequest.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/two-km-sidequest.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/two-km-sidequest.html">
  <link rel="stylesheet" href="../assets/two-km-sidequest.css?v=20260525manual1">
</head>
<body class="sq-app">
  <header class="sq-nav">
    <a class="sq-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="sq-mark">C</span>
      <span><strong>ChillOut</strong><small>T043 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_two_km_sidequest_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="sq-hero">
      <div class="sq-hero-copy">
        <p class="sq-kicker">T043 · two kilometer sidequest</p>
        <h1>主景點旁邊，才常常藏著今天最像自己的地方。</h1>
        <p>輸入你已經要去的主景點，再放入 2 公里內可能的小支線。工具會幫你挑出不繞太遠、體力吃得下、又有記憶點的微冒險。</p>
      </div>
      <figure class="sq-visual">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1100&q=80" alt="城市步行支線小路">
      </figure>
    </section>

    <section class="sq-workbench" aria-label="2 公里支線任務操作區">
      <aside class="sq-settings" aria-label="支線條件">
        <p class="sq-kicker">Sidequest settings</p>
        <h2>支線條件</h2>
        <label>
          主景點
          <input data-main value="台北故宮" placeholder="例如：清水寺、南山塔、赤崁樓">
        </label>
        <div class="sq-two">
          <label>
            可用時間
            <select data-window>
              <option value="30">30 分鐘</option>
              <option value="45" selected>45 分鐘</option>
              <option value="75">75 分鐘</option>
              <option value="120">2 小時</option>
            </select>
          </label>
          <label>
            移動方式
            <select data-move>
              <option value="walk">步行</option>
              <option value="bike">腳踏車</option>
              <option value="bus">公車</option>
              <option value="taxi">叫車</option>
            </select>
          </label>
        </div>
        <label class="sq-range"><span>步行上限 <strong data-distance-label>2.0 km</strong></span><input data-distance type="range" min="0.4" max="2" step="0.1" value="2"></label>
        <label class="sq-range"><span>體力餘裕 <strong data-energy-label>64/100</strong></span><input data-energy type="range" min="1" max="100" value="64"></label>
        <label class="sq-range"><span>驚喜偏好 <strong data-surprise-label>78/100</strong></span><input data-surprise type="range" min="1" max="100" value="78"></label>
        <div class="sq-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-quest>新增支線</button>
        </div>
      </aside>

      <section class="sq-quests" aria-label="候選支線">
        <div class="sq-quest-head">
          <div>
            <p class="sq-kicker">Sidequest candidates</p>
            <h2>候選支線</h2>
          </div>
          <button type="button" class="sq-primary" data-generate>生成支線任務</button>
        </div>
        <div class="sq-quest-list" data-quests></div>
      </section>
    </section>

    <section class="sq-output" data-output aria-live="polite">
      <div class="sq-empty">
        <p class="sq-kicker">Result</p>
        <h2>先放入候選支線，這裡會生成 2 公里微冒險。</h2>
        <p>結果會包含三個支線任務、放棄條件、分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="sq-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/two-km-sidequest.js?v=20260525manual1"></script>
</body>
</html>
