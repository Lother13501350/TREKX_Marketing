<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>城市靈魂伴侶｜ChillOut 旅行小工具 T012</title>
  <meta name="description" content="用節奏、食物、安靜程度與季節感配對最像你的下一座城市，並產生 ChillOut 起手行程 prompt。">
  <meta property="og:title" content="城市靈魂伴侶｜ChillOut">
  <meta property="og:description" content="找出最像你的城市，而不是最熱門的城市。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/city-soulmate.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/city-soulmate.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/city-soulmate.html">
  <link rel="stylesheet" href="../assets/city-soulmate.css?v=20260525manual1">
</head>
<body class="soulmate-app">
  <header class="cs-topbar">
    <a class="cs-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="cs-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T012 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_city_soulmate_nav">下載 App</a>
    </nav>
  </header>

  <main class="cs-page">
    <section class="cs-hero">
      <p class="cs-eyebrow">City soulmate matcher</p>
      <h1>下一站，不一定要選最紅的。</h1>
      <p>回答幾個旅行偏好，找出最像你的城市。結果會給你配對理由、第一天起手路線，還有可以直接丟進 ChillOut 的 prompt。</p>
    </section>

    <section class="cs-match" aria-label="城市靈魂伴侶操作區">
      <form class="cs-form" data-form>
        <label class="cs-field">
          <span>想要的旅行節奏</span>
          <select data-pace>
            <option value="slow" selected>慢慢晃，不趕行程</option>
            <option value="balanced">每天有主題就好</option>
            <option value="dense">想看很多東西</option>
          </select>
        </label>

        <label class="cs-field">
          <span>最重要的快樂來源</span>
          <select data-anchor>
            <option value="food" selected>食物與咖啡</option>
            <option value="design">設計、展覽、小店</option>
            <option value="nature">自然、海、山、散步</option>
            <option value="night">夜景、酒吧、城市感</option>
          </select>
        </label>

        <label class="cs-field">
          <span>能接受的熱鬧程度</span>
          <select data-noise>
            <option value="quiet" selected>越安靜越好</option>
            <option value="middle">熱鬧但要能休息</option>
            <option value="loud">人多才像旅行</option>
          </select>
        </label>

        <label class="cs-field">
          <span>想要的季節感</span>
          <select data-season>
            <option value="cool" selected>涼一點、好走路</option>
            <option value="warm">溫暖、放鬆</option>
            <option value="rain">下雨也可以好玩</option>
          </select>
        </label>

        <div class="cs-actions">
          <button class="cs-button" type="button" data-random>隨機配對</button>
          <button class="cs-button cs-primary" type="submit">找我的城市</button>
        </div>
      </form>

      <section class="cs-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="cs-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/city-soulmate.js?v=20260525manual1"></script>
</body>
</html>
