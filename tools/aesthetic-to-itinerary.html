<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行美學轉行程｜ChillOut 旅行小工具 T010</title>
  <meta name="description" content="選一種旅行美學與目的地，產出一日路線、拍照任務、節奏提醒與可丟進 ChillOut 的行程 prompt。">
  <meta property="og:title" content="旅行美學轉行程｜ChillOut">
  <meta property="og:description" content="先選風格，再讓行程長出來。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/aesthetic-to-itinerary.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/aesthetic-to-itinerary.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/aesthetic-to-itinerary.html">
  <link rel="stylesheet" href="../assets/aesthetic-to-itinerary.css?v=20260525manual1">
</head>
<body class="aesthetic-app">
  <header class="ai-topbar">
    <a class="ai-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="ai-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T010 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_aesthetic_to_itinerary_nav">下載 App</a>
    </nav>
  </header>

  <main class="ai-page">
    <section class="ai-hero">
      <p class="ai-eyebrow">Aesthetic to itinerary</p>
      <h1>先選風格，再讓行程長出來。</h1>
      <p>不是每趟旅行都要從景點開始。選一種今天想要的美學，輸入目的地，工具會把風格轉成路線節奏、拍照任務和 ChillOut 生成 prompt。</p>
    </section>

    <section class="ai-studio" aria-label="旅行美學轉行程操作區">
      <form class="ai-panel" data-form>
        <label class="ai-field">
          <span>目的地</span>
          <input data-city value="東京" autocomplete="off">
        </label>

        <label class="ai-field">
          <span>今天的旅行美學</span>
          <select data-aesthetic>
            <option value="cream" selected>奶油咖啡感</option>
            <option value="neon">霓虹夜拍感</option>
            <option value="retro">復古街區感</option>
            <option value="forest">森林慢走感</option>
            <option value="sea">海風空白感</option>
          </select>
        </label>

        <div class="ai-grid">
          <label class="ai-field">
            <span>旅行節奏</span>
            <select data-pace>
              <option value="slow" selected>慢慢走</option>
              <option value="balanced">剛剛好</option>
              <option value="full">想多拍一點</option>
            </select>
          </label>
          <label class="ai-field">
            <span>出發時段</span>
            <select data-start>
              <option value="morning" selected>上午</option>
              <option value="afternoon">下午</option>
              <option value="night">晚上</option>
            </select>
          </label>
        </div>

        <label class="ai-field">
          <span>想放進去的元素</span>
          <textarea data-elements spellcheck="false" placeholder="每行一個：咖啡、書店、夜景、老街、海邊、展覽"></textarea>
        </label>

        <div class="ai-actions">
          <button class="ai-button" type="button" data-sample>載入示範</button>
          <button class="ai-button ai-primary" type="submit">生成風格行程</button>
        </div>
      </form>

      <section class="ai-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="ai-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/aesthetic-to-itinerary.js?v=20260525manual1"></script>
</body>
</html>
