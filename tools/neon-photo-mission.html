<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>霓虹拍照任務｜ChillOut 旅行小工具 T037</title>
  <meta name="description" content="把夜間城市感照片變成可執行的拍照任務板。選城市、風格、拍攝對象與任務素材，生成招牌、倒影、路口、人物與細節拍攝順序，導回 ChillOut 做回憶錄。">
  <meta property="og:title" content="霓虹拍照任務｜ChillOut 旅行小工具 T037">
  <meta property="og:description" content="霓虹不是背景，是照片任務。用任務卡拍出一組夜晚城市照片。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/neon-photo-mission.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/neon-photo-mission.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/neon-photo-mission.html">
  <link rel="stylesheet" href="../assets/neon-photo-mission.css?v=20260525manual1">
</head>
<body class="np-app">
  <header class="np-nav">
    <a class="np-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="np-mark">C</span>
      <span><strong>ChillOut</strong><small>T037 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_neon_photo_mission_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="np-hero">
      <div class="np-hero-copy">
        <p class="np-kicker">T037 · neon photo mission</p>
        <h1>不要只說要拍夜景，把它拆成五個任務。</h1>
        <p>輸入城市、拍攝對象與你想要的夜晚感，工具會把招牌、倒影、路口、人物和細節排成一組可執行的任務板。拍完直接丟進 ChillOut 做回憶錄或下一趟靈感。</p>
      </div>
      <figure class="np-visual">
        <img src="https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=1100&q=80" alt="夜晚霓虹街道">
      </figure>
    </section>

    <section class="np-workbench" aria-label="霓虹拍照任務操作區">
      <aside class="np-settings" aria-label="拍攝設定">
        <p class="np-kicker">Shoot settings</p>
        <h2>拍攝設定</h2>
        <label>
          城市 / 區域
          <input data-city value="大阪道頓堀" placeholder="例如：首爾弘大、台北西門町、東京新宿">
        </label>
        <div class="np-two">
          <label>
            分享格式
            <select data-format>
              <option value="story">限動九宮格</option>
              <option value="post">IG 貼文</option>
              <option value="reel">短影音封面</option>
              <option value="memoir">旅行回憶錄</option>
            </select>
          </label>
          <label>
            拍攝對象
            <select data-subject>
              <option value="solo">自己一人</option>
              <option value="couple">兩人同行</option>
              <option value="friends">朋友群</option>
              <option value="street">只拍街景</option>
            </select>
          </label>
        </div>
        <label>
          這組照片的標題感
          <input data-title value="今晚城市像一張電影海報" placeholder="例如：雨後的街像在發光">
        </label>
        <label class="np-range">
          <span>情緒濃度 <strong data-emotion-label>72/100</strong></span>
          <input data-emotion type="range" min="1" max="100" value="72">
        </label>
        <label class="np-range">
          <span>安全保守 <strong data-safety-label>68/100</strong></span>
          <input data-safety type="range" min="1" max="100" value="68">
        </label>
        <div class="np-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-shot>新增任務</button>
        </div>
      </aside>

      <section class="np-missions" aria-label="拍照任務">
        <div class="np-mission-head">
          <div>
            <p class="np-kicker">Mission board</p>
            <h2>任務素材</h2>
          </div>
          <button type="button" class="np-primary" data-generate>生成拍照任務</button>
        </div>
        <div class="np-mission-list" data-missions></div>
      </section>
    </section>

    <section class="np-output" data-output aria-live="polite">
      <div class="np-empty">
        <p class="np-kicker">Result</p>
        <h2>先設定任務素材，這裡會生成一組可拍的霓虹照片任務。</h2>
        <p>結果會包含拍攝順序、每張照片構圖提示、限動文案與 ChillOut 回憶錄 prompt。</p>
      </div>
    </section>
  </main>

  <div class="np-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/neon-photo-mission.js?v=20260525manual1"></script>
</body>
</html>
