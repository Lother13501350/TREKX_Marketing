<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅遊創作者路線 Remix｜ChillOut 旅行小工具 T003</title>
  <meta name="description" content="貼上創作者旅遊路線，依自己的預算、節奏與雷點重混成更適合自己的版本，產生 Remix 時間線與 ChillOut prompt。">
  <meta property="og:title" content="旅遊創作者路線 Remix｜不要照抄，改成你的版本">
  <meta property="og:description" content="保留創作者靈感，但避開人潮、預算不合與不適合你的點。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/creator-trip-remix.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/creator-trip-remix.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/creator-trip-remix.html">
  <link rel="stylesheet" href="../assets/creator-remix.css?v=20260525a">
</head>
<body class="creator-remix-app">
  <div class="cr-shell">
    <header class="cr-nav">
      <a class="cr-brand" href="../travel-microtools-100.html">
        <span class="cr-mark">C</span>
        <span><strong>ChillOut</strong><small>T003 Creator Route Remix</small></span>
      </a>
      <nav aria-label="主要導覽">
        <a href="../travel-microtools-100.html">100 小工具</a>
        <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
        <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_creator_remix_nav">下載 App</a>
      </nav>
    </header>

    <main>
      <section class="cr-hero">
        <div>
          <p class="cr-kicker">T003 · creator route remix</p>
          <h1>旅遊創作者路線 Remix</h1>
          <p class="cr-lead">看到創作者路線很心動，但不想照抄？貼上原路線，工具會依你的預算、步調與雷點標出保留、替換、降級與升級，變成自己的版本。</p>
          <div class="cr-actions">
            <button class="cr-button primary" data-demo>載入示範路線</button>
            <a class="cr-button" href="#remix">開始 Remix</a>
            <a class="cr-button" href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_creator_remix_hero">下載 ChillOut</a>
          </div>
        </div>
        <aside class="cr-media" aria-label="旅遊創作者素材照片">
          <div class="cr-media-card">
            <span>Web asset · Unsplash</span>
            <strong>把創作者靈感保留，把不適合你的部分換掉。</strong>
          </div>
        </aside>
      </section>

      <section class="cr-workbench" id="remix">
        <aside class="cr-input">
          <div class="cr-title">
            <h2>貼上創作者路線</h2>
            <small>每行一站</small>
          </div>

          <label class="cr-field">
            <span>創作者名稱或來源</span>
            <input data-creator value="首爾咖啡旅人">
          </label>

          <label class="cr-field">
            <span>原始路線</span>
            <textarea data-creator-route></textarea>
          </label>

          <div class="cr-grid-2">
            <label class="cr-field">
              <span>目的地</span>
              <input data-city value="首爾">
            </label>
            <label class="cr-field">
              <span>預算</span>
              <select data-budget>
                <option>低預算</option>
                <option selected>中等</option>
                <option>願意加碼</option>
              </select>
            </label>
          </div>

          <div class="cr-grid-2">
            <label class="cr-field">
              <span>步調</span>
              <select data-pace>
                <option>慢旅</option>
                <option selected>剛好</option>
                <option>緊湊</option>
              </select>
            </label>
            <label class="cr-field">
              <span>想避開</span>
              <input data-avoid placeholder="例如：明洞、人潮、酒吧">
            </label>
          </div>

          <div class="cr-remix-controls">
            <label class="cr-toggle"><span>保留拍照亮點</span><input type="checkbox" data-keepPhotos checked></label>
            <label class="cr-toggle"><span>降低人潮摩擦</span><input type="checkbox" data-reduceCrowds checked></label>
            <label class="cr-toggle"><span>升級吃喝記憶點</span><input type="checkbox" data-foodUpgrade></label>
          </div>

          <button class="cr-button primary full" data-remix>生成 Remix 版本</button>
        </aside>

        <section class="cr-output">
          <div class="cr-title">
            <h2>Remix 工作台</h2>
            <small>原路線 vs 你的版本</small>
          </div>
          <div class="cr-summary" data-summary></div>
          <div class="cr-board" data-board></div>
          <div class="cr-plan">
            <section class="cr-route" data-route></section>
            <aside class="cr-card" data-card></aside>
          </div>
        </section>
      </section>
    </main>
  </div>
  <div class="cr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/creator-remix.js?v=20260525a"></script>
</body>
</html>
