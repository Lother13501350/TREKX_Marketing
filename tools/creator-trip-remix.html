<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行創作者路線 Remix｜ChillOut 旅行小工具 T003</title>
  <meta name="description" content="貼上創作者推薦路線，依自己的預算、節奏與避雷條件，改成更適合自己的 Remix 版本，產生時間線、分享文案與 ChillOut prompt。">
  <meta property="og:title" content="旅行創作者路線 Remix｜ChillOut">
  <meta property="og:description" content="保留創作者靈感，但把不適合你的部分換掉。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/creator-trip-remix.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/creator-trip-remix.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/creator-trip-remix.html">
  <link rel="stylesheet" href="../assets/creator-remix.css?v=20260525manual2">
</head>
<body class="creator-remix-app">
  <header class="cr-topbar">
    <a class="cr-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="cr-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T003 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_creator_remix_nav">下載 App</a>
    </nav>
  </header>

  <main class="cr-shell">
    <section class="cr-hero">
      <div>
        <p class="cr-eyebrow">Creator route remix</p>
        <h1>不要照抄創作者路線，改成你的版本。</h1>
        <p>看到創作者路線很心動，但怕太趕、太貴、太多人？貼上原路線，工具會幫你標出保留、替換、降級、升級，最後輸出一條可以交給 ChillOut 接手的 Remix 時間線。</p>
      </div>
      <aside class="cr-visual" aria-label="Remix 結果預覽">
        <span>Remix score</span>
        <strong data-hero-score>--</strong>
        <p>保留靈感，換掉摩擦。</p>
      </aside>
    </section>

    <section class="cr-workbench" id="remix">
      <form class="cr-input" data-form>
        <div class="cr-section-title">
          <h2>貼上原路線</h2>
          <p>每行一站，可含時間。</p>
        </div>

        <label class="cr-field">
          <span>創作者或來源</span>
          <input data-creator value="首爾咖啡旅人" autocomplete="off">
        </label>

        <label class="cr-field">
          <span>原始路線</span>
          <textarea data-route spellcheck="false"></textarea>
        </label>

        <div class="cr-grid">
          <label class="cr-field">
            <span>目的地</span>
            <input data-city value="首爾" autocomplete="off">
          </label>
          <label class="cr-field">
            <span>預算</span>
            <select data-budget>
              <option value="低預算">低預算</option>
              <option value="中等" selected>中等</option>
              <option value="可加碼">可加碼</option>
            </select>
          </label>
        </div>

        <div class="cr-grid">
          <label class="cr-field">
            <span>節奏</span>
            <select data-pace>
              <option value="慢旅">慢旅</option>
              <option value="剛好" selected>剛好</option>
              <option value="緊湊">緊湊</option>
            </select>
          </label>
          <label class="cr-field">
            <span>想避開</span>
            <input data-avoid placeholder="例如：明洞、人潮、酒吧" autocomplete="off">
          </label>
        </div>

        <fieldset class="cr-toggles">
          <legend>Remix 條件</legend>
          <label><input type="checkbox" data-keep-photos checked> 保留好拍亮點</label>
          <label><input type="checkbox" data-reduce-crowds checked> 降低人潮摩擦</label>
          <label><input type="checkbox" data-food-upgrade> 升級吃喝記憶點</label>
        </fieldset>

        <div class="cr-actions">
          <button class="cr-button" type="button" data-demo>載入示範</button>
          <button class="cr-button cr-primary" type="submit">生成 Remix</button>
        </div>
      </form>

      <section class="cr-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="cr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/creator-remix.js?v=20260525manual2"></script>
</body>
</html>
