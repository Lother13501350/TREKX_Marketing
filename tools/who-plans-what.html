<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行分工抽籤｜ChillOut 旅行小工具 T025</title>
  <meta name="description" content="把旅行前的餐廳、交通、住宿、拍照、預算與備案分配給同行成員，輸出公平負載、群組公告與 ChillOut prompt。">
  <meta property="og:title" content="旅行分工抽籤｜ChillOut">
  <meta property="og:description" content="主揪不該是一個人的職業，把任務變成大家都能接受的分工表。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/who-plans-what.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/who-plans-what.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/who-plans-what.html">
  <link rel="stylesheet" href="../assets/who-plans-what.css?v=20260525manual1">
</head>
<body class="wp-app">
  <header class="wp-topbar">
    <a class="wp-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="wp-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T025 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_who_plans_what_nav">下載 App</a>
    </nav>
  </header>

  <main class="wp-page">
    <section class="wp-hero">
      <p class="wp-eyebrow">Trip task draft</p>
      <h1>排行程不要再靠一個人硬撐。</h1>
      <p>把人、任務與難度放進來，工具會依照擅長項目、可投入時間與決斷力分配工作，讓餐廳、交通、住宿、拍照、預算與備案都有負責人。</p>
    </section>

    <section class="wp-grid" aria-label="旅行分工抽籤操作區">
      <aside class="wp-panel wp-settings">
        <form data-trip-form>
          <label class="wp-field">
            <span>旅行名稱</span>
            <input data-trip value="四人東京週末" autocomplete="off">
          </label>
          <div class="wp-two">
            <label class="wp-field">
              <span>出發倒數天數</span>
              <input data-countdown type="number" min="1" max="180" value="21">
            </label>
            <label class="wp-field">
              <span>目前主揪壓力</span>
              <select data-pressure>
                <option value="low">還可以</option>
                <option value="mid" selected>開始有壓力</option>
                <option value="high">快爆炸</option>
              </select>
            </label>
          </div>
          <label class="wp-range">
            <span>群組回覆速度 <strong data-reply-value>46</strong></span>
            <input data-reply type="range" min="0" max="100" value="46">
          </label>
          <div class="wp-actions">
            <button type="button" class="wp-button" data-sample>載入示範</button>
            <button type="button" class="wp-button" data-add-person>加成員</button>
            <button type="button" class="wp-button" data-add-task>加任務</button>
          </div>
        </form>
      </aside>

      <section class="wp-panel wp-people">
        <div class="wp-section-head">
          <div>
            <p class="wp-eyebrow">People</p>
            <h2>誰可以負責什麼</h2>
          </div>
        </div>
        <div class="wp-people-list" data-people></div>
      </section>

      <section class="wp-panel wp-tasks">
        <div class="wp-section-head">
          <div>
            <p class="wp-eyebrow">Tasks</p>
            <h2>要分出去的任務</h2>
          </div>
          <button type="button" class="wp-button wp-primary" data-generate>重新分配</button>
        </div>
        <div class="wp-task-list" data-tasks></div>
      </section>

      <section class="wp-panel wp-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="wp-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/who-plans-what.js?v=20260525manual1"></script>
</body>
</html>
