<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情侶旅行雷區圖｜ChillOut 旅行小工具 T022</title>
  <meta name="description" content="評估情侶旅行的起床、拍照、吃飯、預算、放風、決策、浪漫與節奏雷區，產生避雷協議與 ChillOut 路線 prompt。">
  <meta property="og:title" content="情侶旅行雷區圖｜ChillOut">
  <meta property="og:description" content="浪漫不是不規劃，是把爆點移除。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/couple-conflict-map.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/couple-conflict-map.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/couple-conflict-map.html">
  <link rel="stylesheet" href="../assets/couple-conflict-map.css?v=20260525manual1">
</head>
<body class="couple-app">
  <header class="cm-topbar">
    <a class="cm-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="cm-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T022 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_couple_conflict_map_nav">下載 App</a>
    </nav>
  </header>

  <main class="cm-page">
    <section class="cm-hero">
      <p class="cm-eyebrow">Couple conflict map</p>
      <h1>浪漫不是不規劃，是把爆點移除。</h1>
      <p>情侶旅行最怕不是行程不好，是兩個人期待沒有講清楚。先把八個雷區標出來，再讓 ChillOut 排一條比較不容易吵的路線。</p>
    </section>

    <section class="cm-tool" aria-label="情侶旅行雷區圖操作區">
      <form class="cm-form" data-form>
        <div class="cm-grid">
          <label class="cm-field">
            <span>你</span>
            <input data-me value="我" autocomplete="off">
          </label>
          <label class="cm-field">
            <span>對方</span>
            <input data-partner value="另一半" autocomplete="off">
          </label>
        </div>

        <label class="cm-range"><span>起床時間落差 <strong data-value="wake">66</strong></span><input data-wake type="range" min="0" max="100" value="66"></label>
        <label class="cm-range"><span>拍照耐心落差 <strong data-value="photo">74</strong></span><input data-photo type="range" min="0" max="100" value="74"></label>
        <label class="cm-range"><span>吃飯期待落差 <strong data-value="food">58</strong></span><input data-food type="range" min="0" max="100" value="58"></label>
        <label class="cm-range"><span>預算觀念落差 <strong data-value="budget">52</strong></span><input data-budget type="range" min="0" max="100" value="52"></label>
        <label class="cm-range"><span>各自放風需求 <strong data-value="alone">48</strong></span><input data-alone type="range" min="0" max="100" value="48"></label>
        <label class="cm-range"><span>誰做決定敏感度 <strong data-value="decision">64</strong></span><input data-decision type="range" min="0" max="100" value="64"></label>
        <label class="cm-range"><span>浪漫期待落差 <strong data-value="romance">70</strong></span><input data-romance type="range" min="0" max="100" value="70"></label>
        <label class="cm-range"><span>行程密度落差 <strong data-value="pace">62</strong></span><input data-pace type="range" min="0" max="100" value="62"></label>

        <label class="cm-field">
          <span>這趟最想保住什麼</span>
          <select data-goal>
            <option value="mood" selected>不要吵架</option>
            <option value="photo">漂亮回憶</option>
            <option value="food">好好吃飯</option>
            <option value="rest">放鬆休息</option>
          </select>
        </label>

        <div class="cm-actions">
          <button class="cm-button" type="button" data-sample>載入示範</button>
          <button class="cm-button cm-primary" type="submit">生成雷區圖</button>
        </div>
      </form>

      <section class="cm-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="cm-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/couple-conflict-map.js?v=20260525manual1"></script>
</body>
</html>
