<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小鎮氛圍雷達｜ChillOut 旅行小工具 T046</title>
  <meta name="description" content="T046 手寫版。比較 2 到 5 個候選小鎮的交通、安靜度、食物、風景、雨天備案與末班車風險，選出最適合此刻心情的小鎮玩法。">
  <meta property="og:title" content="小鎮氛圍雷達｜ChillOut 旅行小工具 T046">
  <meta property="og:description" content="不是每個小鎮都適合你今天的狀態。輸入候選小鎮，產生排名、玩法與 ChillOut prompt。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/small-town-mood.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/small-town-mood-manual.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/small-town-mood.html">
  <link rel="stylesheet" href="../assets/small-town-mood.css?v=20260525manual1">
</head>
<body class="st-app">
  <header class="st-nav">
    <a class="st-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="st-mark">C</span>
      <span><strong>ChillOut</strong><small>T046 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_small_town_mood_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="st-hero">
      <figure class="st-map">
        <img src="../assets/tool-posters/small-town-mood-manual.svg" alt="小鎮氛圍雷達視覺">
      </figure>
      <div class="st-hero-copy">
        <p class="st-kicker">T046 / Small town mood radar</p>
        <h1>選小鎮，不是選名字，是選今天的空氣。</h1>
        <p>把候選小鎮放進來，調整交通、安靜、食物、風景、雨天備案與末班車風險，雷達會找出最符合你這次心情的小鎮，並把玩法丟回 ChillOut 延伸成完整行程。</p>
      </div>
    </section>

    <section class="st-control" aria-label="旅行心情設定">
      <div>
        <p class="st-kicker">Trip mood</p>
        <h2>先定義這趟小鎮旅行想要什麼</h2>
      </div>
      <label>出發地
        <input data-origin value="台北" placeholder="例如：台北、首爾、福岡、墨爾本">
      </label>
      <label>今天想得到
        <select data-goal>
          <option value="quiet" selected>安靜補血</option>
          <option value="food">食物小旅行</option>
          <option value="visual">漂亮散步</option>
          <option value="culture">書店與老街</option>
          <option value="family">親子低壓</option>
        </select>
      </label>
      <label>可接受單程交通
        <select data-max-transfer>
          <option value="40">40 分鐘內</option>
          <option value="70" selected>70 分鐘內</option>
          <option value="100">100 分鐘內</option>
          <option value="140">140 分鐘內</option>
        </select>
      </label>
      <label>天氣
        <select data-weather>
          <option value="clear" selected>天氣穩定</option>
          <option value="rain">可能下雨</option>
          <option value="hot">很熱</option>
          <option value="cold">偏冷</option>
        </select>
      </label>
      <button type="button" data-sample>帶入範例</button>
    </section>

    <section class="st-workbench" aria-label="候選小鎮比較">
      <div class="st-town-head">
        <div>
          <p class="st-kicker">Town candidates</p>
          <h2>候選小鎮</h2>
        </div>
        <div class="st-actions">
          <button type="button" data-add-town>新增小鎮</button>
          <button type="button" class="st-primary" data-generate>產生雷達結果</button>
        </div>
      </div>
      <div class="st-town-grid" data-towns></div>
    </section>

    <section class="st-output" data-output aria-live="polite">
      <div class="st-empty">
        <p class="st-kicker">Result</p>
        <h2>先放入至少兩個候選小鎮，再讓雷達挑出最適合的一個。</h2>
        <p>結果會包含排名、選擇理由、當日玩法、避雷條件、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="st-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/small-town-mood.js?v=20260525manual1"></script>
</body>
</html>
