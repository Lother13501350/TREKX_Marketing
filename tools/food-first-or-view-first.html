<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美食派還是風景派｜ChillOut 旅行小工具 T016</title>
  <meta name="description" content="用飢餓優先、排隊耐受、景色期待、步行、預算與拍照需求，判斷行程該先鎖餐廳還是先鎖風景。">
  <meta property="og:title" content="美食派還是風景派｜ChillOut">
  <meta property="og:description" content="順序對了，整天都會輕鬆很多。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/food-first-or-view-first.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/food-first-or-view-first.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/food-first-or-view-first.html">
  <link rel="stylesheet" href="../assets/food-first-or-view-first.css?v=20260525manual1">
</head>
<body class="priority-app">
  <header class="fv-topbar">
    <a class="fv-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="fv-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T016 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_food_first_or_view_first_nav">下載 App</a>
    </nav>
  </header>

  <main class="fv-page">
    <section class="fv-hero">
      <p class="fv-eyebrow">Food first or view first</p>
      <h1>先決定今天怎麼吃，再決定怎麼走。</h1>
      <p>很多行程不是景點不好，是順序錯。這個工具會幫你判斷今天要先鎖餐廳、先鎖風景，還是用混合節奏安排，避免餓著排隊或拍完沒東西吃。</p>
    </section>

    <section class="fv-tool" aria-label="美食派還是風景派操作區">
      <form class="fv-form" data-form>
        <div class="fv-grid">
          <label class="fv-field">
            <span>目的地</span>
            <input data-city value="京都" autocomplete="off">
          </label>
          <label class="fv-field">
            <span>今天想吃</span>
            <input data-craving value="咖啡、鰻魚飯、抹茶甜點" autocomplete="off">
          </label>
        </div>

        <label class="fv-range">
          <span>飢餓不能忍程度 <strong data-value="hunger">72</strong></span>
          <input data-hunger type="range" min="0" max="100" value="72">
        </label>

        <label class="fv-range">
          <span>排隊耐受度 <strong data-value="queue">38</strong></span>
          <input data-queue type="range" min="0" max="100" value="38">
        </label>

        <label class="fv-range">
          <span>景色期待 <strong data-value="view">68</strong></span>
          <input data-view type="range" min="0" max="100" value="68">
        </label>

        <label class="fv-range">
          <span>步行耐受度 <strong data-value="walk">55</strong></span>
          <input data-walk type="range" min="0" max="100" value="55">
        </label>

        <div class="fv-grid">
          <label class="fv-field">
            <span>單日預算</span>
            <select data-budget>
              <option value="low">省一點</option>
              <option value="mid" selected>正常吃</option>
              <option value="high">吃好一點</option>
            </select>
          </label>
          <label class="fv-field">
            <span>拍照需求</span>
            <select data-photo>
              <option value="low">不重要</option>
              <option value="mid" selected>要有幾張</option>
              <option value="high">照片是主線</option>
            </select>
          </label>
        </div>

        <label class="fv-field">
          <span>固定用餐時段</span>
          <select data-mealtime>
            <option value="early">早吃，不要餓</option>
            <option value="normal" selected>正常午晚餐</option>
            <option value="late">可以晚點吃</option>
          </select>
        </label>

        <div class="fv-actions">
          <button class="fv-button" type="button" data-sample>載入示範</button>
          <button class="fv-button fv-primary" type="submit">判斷排序</button>
        </div>
      </form>

      <section class="fv-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="fv-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/food-first-or-view-first.js?v=20260525manual1"></script>
</body>
</html>
