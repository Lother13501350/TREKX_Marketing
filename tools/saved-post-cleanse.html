<body class="saved-cleanse-app">
  <header class="sc-topbar">
    <a class="sc-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="sc-logo">C</span>
      <span>
        <strong>ChillOut</strong>

    <nav aria-label="主要導覽">

  <main class="sc-shell">
    <section class="sc-hero">
      <p class="sc-eyebrow">Swipe your saved places</p>
      <h1>把永遠不會去的收藏清掉。</h1>
      <p>每次只看一個收藏，按下保留、備用或刪除。清完後，它會整理出真正值得丟進 ChillOut 的清單、分享文案與行程 prompt。</p>

      <div class="sc-loader-actions">
        <button class="sc-button" type="button" data-sample>載入示範</button>
        <button class="sc-button sc-primary" type="button" data-start>開始清理</button>
      </div>

      <section class="sc-card" data-card></section>
      <aside class="sc-summary" data-summary></aside>
