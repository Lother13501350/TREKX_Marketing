<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜遊安全通行證｜ChillOut 旅行小工具 T036</title>
  <meta name="description" content="把夜遊風險轉成一張可執行的安全通行證。輸入城市、同行人數、回程方式與檢核項目，生成夜遊限制、不要去區域、分享文與 ChillOut prompt。">
  <meta property="og:title" content="夜遊安全通行證｜ChillOut 旅行小工具 T036">
  <meta property="og:description" content="玩得晚可以，但回得去更重要。用一張通行證檢查夜遊是否可以出門。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/night-safety-pass.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/night-safety-pass.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/night-safety-pass.html">
  <link rel="stylesheet" href="../assets/night-safety-pass.css?v=20260525manual1">
</head>
<body class="ns-app">
  <header class="ns-nav">
    <a class="ns-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="ns-mark">C</span>
      <span><strong>ChillOut</strong><small>T036 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_night_safety_pass_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="ns-hero">
      <div class="ns-hero-copy">
        <p class="ns-kicker">T036 · night safety pass</p>
        <h1>夜遊可以很自由，但邊界要先畫好。</h1>
        <p>這不是恐嚇工具，而是一張出門前的通行證。把回程、同行人、電量、集合點、現金與主路線先檢查，才決定今晚可以走多晚、走多遠。</p>
      </div>
      <figure class="ns-visual">
        <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1100&q=80" alt="夜晚城市街道">
      </figure>
    </section>

    <section class="ns-workbench" aria-label="夜遊安全通行證操作區">
      <aside class="ns-settings" aria-label="夜遊條件">
        <p class="ns-kicker">Night conditions</p>
        <h2>今晚條件</h2>
        <label>
          城市
          <input data-city value="首爾" placeholder="例如：東京、台北、曼谷">
        </label>
        <label>
          夜遊區域
          <input data-zone value="漢江到弘大主路線" placeholder="例如：中山站周邊、難波商圈">
        </label>
        <div class="ns-two">
          <label>
            出門時間
            <input data-start type="time" value="20:30">
          </label>
          <label>
            最晚回程
            <input data-return type="time" value="23:40">
          </label>
        </div>
        <div class="ns-two">
          <label>
            同行人數
            <input data-group type="number" min="1" max="12" value="2">
          </label>
          <label>
            回程方式
            <select data-transport>
              <option value="taxi">計程車 / 叫車</option>
              <option value="metro">大眾運輸</option>
              <option value="walk">步行回住宿</option>
              <option value="unknown">尚未確定</option>
            </select>
          </label>
        </div>
        <label class="ns-range">
          <span>保守程度 <strong data-caution-label>76/100</strong></span>
          <input data-caution type="range" min="1" max="100" value="76">
        </label>
        <div class="ns-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-check>新增檢核</button>
        </div>
      </aside>

      <section class="ns-checks" aria-label="安全檢核">
        <div class="ns-check-head">
          <div>
            <p class="ns-kicker">Safety checklist</p>
            <h2>安全檢核</h2>
          </div>
          <button type="button" class="ns-primary" data-generate>生成通行證</button>
        </div>
        <div class="ns-check-list" data-checks></div>
      </section>
    </section>

    <section class="ns-output" data-output aria-live="polite">
      <div class="ns-empty">
        <p class="ns-kicker">Result</p>
        <h2>先完成檢核，這裡會生成今晚夜遊安全通行證。</h2>
        <p>通行證會輸出分數、夜遊邊界、不要去區域、群組公告與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="ns-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/night-safety-pass.js?v=20260525manual1"></script>
</body>
</html>
