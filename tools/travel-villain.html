<head>
  <meta charset="utf-8">

  <meta property="og:title" content="你是哪種旅行反派｜ChillOut">

  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/travel-villain.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/travel-villain.svg">

</head>
<body class="villain-app">
  <header class="tv-topbar">
    <a class="tv-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="tv-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T013 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_travel_villain_nav">下載 App</a>
    </nav>
  </header>

  <main class="tv-page">
    <section class="tv-hero">
      <p class="tv-eyebrow">Travel villain warrant</p>
      <h1>先承認自己的旅行反派，旅伴才有活路。</h1>
      <p>這不是嚴肅人格測驗，是一張可以丟群組互相傷害一下的旅行通緝令。測完會給你修正方式，讓 ChillOut 幫你排出比較不雷的行程。</p>
    </section>

    <section class="tv-stage" aria-label="旅行反派測驗操作區">
      <form class="tv-form" data-form>
        <fieldset class="tv-question">
          <legend>出門時間到了，你通常是？</legend>
          <button type="button" data-choice data-key="morning" data-value="late">還在找襪子</button>
          <button type="button" data-choice data-key="morning" data-value="command">已經在催大家</button>
          <button type="button" data-choice data-key="morning" data-value="camera">先拍今天穿搭</button>
        </fieldset>

        <fieldset class="tv-question">
          <legend>選餐廳時你最容易？</legend>
          <button type="button" data-choice data-key="food" data-value="budget">一直算 CP 值</button>
          <button type="button" data-choice data-key="food" data-value="plan">堅持照清單吃</button>
          <button type="button" data-choice data-key="food" data-value="random">路邊看到就想換</button>
        </fieldset>

        <fieldset class="tv-question">
          <legend>看到漂亮景點，你會？</legend>
          <button type="button" data-choice data-key="photo" data-value="director">指揮大家重拍</button>
          <button type="button" data-choice data-key="photo" data-value="skip">看一下就想走</button>
          <button type="button" data-choice data-key="photo" data-value="wander">被旁邊小巷吸走</button>
        </fieldset>

        <fieldset class="tv-question">
          <legend>行程突然延誤，你會？</legend>
          <button type="button" data-choice data-key="delay" data-value="command">重排全部時間表</button>
          <button type="button" data-choice data-key="delay" data-value="late">說那就睡一下</button>
          <button type="button" data-choice data-key="delay" data-value="random">覺得這才是旅行</button>
        </fieldset>

        <div class="tv-actions">
          <button class="tv-button" type="button" data-random>隨機犯罪</button>
          <button class="tv-button tv-primary" type="submit">生成通緝令</button>
        </div>
      </form>

      <section class="tv-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="tv-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/travel-villain.js?v=20260525manual1"></script>

</html>
