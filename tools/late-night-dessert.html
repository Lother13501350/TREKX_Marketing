<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>深夜甜點雷達｜ChillOut 旅行小工具 T034</title>
  <meta name="description" content="把晚餐後的空白變成一條可執行的深夜甜點路線。輸入城市、回程時間、排隊忍耐度與甜點候選點，生成今晚甜點任務卡、分享文與 ChillOut prompt。">
  <meta property="og:title" content="深夜甜點雷達｜ChillOut 旅行小工具 T034">
  <meta property="og:description" content="用候選甜點店、步行距離、排隊時間與營業時間，排出一條不狼狽的深夜甜點路線。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/late-night-dessert.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/late-night-dessert.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/late-night-dessert.html">
  <link rel="stylesheet" href="../assets/late-night-dessert.css?v=20260525manual1">
</head>
<body class="ld-app">
  <header class="ld-nav">
    <a class="ld-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="ld-mark">C</span>
      <span><strong>ChillOut</strong><small>T034 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_late_night_dessert_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="ld-hero">
      <div class="ld-hero-copy">
        <p class="ld-kicker">T034 · Noctourism dessert planner</p>
        <h1>晚餐後還想吃甜點，就先把店、路、回程排乾淨。</h1>
        <p>深夜甜點不是臨時起意亂走。這個工具會用營業時間、排隊忍耐度、步行上限與拍照氛圍，幫你選出今晚主甜點、散步段與備案。</p>
      </div>
      <figure class="ld-visual">
        <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1000&q=80" alt="深夜甜點盤與咖啡">
        <figcaption>甜點任務卡會把結果導回 ChillOut 生成完整行程。</figcaption>
      </figure>
    </section>

    <section class="ld-workbench" aria-label="深夜甜點雷達操作區">
      <aside class="ld-settings" aria-label="今晚條件">
        <div class="ld-panel-head">
          <p class="ld-kicker">Tonight settings</p>
          <h2>今晚條件</h2>
        </div>
        <label>
          城市
          <input data-city value="首爾" placeholder="例如：東京、台南、曼谷">
        </label>
        <label>
          住宿區域
          <input data-hotel value="弘大入口站" placeholder="例如：中山站、難波、明洞">
        </label>
        <div class="ld-two">
          <label>
            出發
            <input data-leave type="time" value="21:20">
          </label>
          <label>
            回到住宿前
            <input data-return type="time" value="23:40">
          </label>
        </div>
        <label>
          今晚想吃
          <select data-mood>
            <option value="cream">奶油蛋糕</option>
            <option value="fruit">水果清爽</option>
            <option value="warm">熱甜湯</option>
            <option value="bakery">烘焙麵包</option>
            <option value="ice">冰品</option>
          </select>
        </label>
        <label class="ld-range">
          <span>步行上限 <strong data-walk-label>18 分鐘</strong></span>
          <input data-walk type="range" min="6" max="35" value="18">
        </label>
        <label class="ld-range">
          <span>排隊忍耐 <strong data-line-label>14 分鐘</strong></span>
          <input data-line type="range" min="0" max="45" value="14">
        </label>
        <label class="ld-check">
          <input data-rain type="checkbox">
          <span>今晚可能下雨，優先室內或近站點</span>
        </label>
        <div class="ld-settings-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-stop>新增甜點點</button>
        </div>
      </aside>

      <section class="ld-stops-area" aria-label="甜點候選點">
        <div class="ld-panel-head ld-stops-head">
          <div>
            <p class="ld-kicker">Dessert candidates</p>
            <h2>甜點候選點</h2>
          </div>
          <button type="button" class="ld-primary" data-generate>生成甜點雷達</button>
        </div>
        <div class="ld-stop-list" data-stops></div>
      </section>
    </section>

    <section class="ld-output" data-output aria-live="polite">
      <div class="ld-empty">
        <p class="ld-kicker">Result</p>
        <h2>先填候選店，這裡會生成今晚甜點任務卡。</h2>
        <p>結果會包含主甜點、散步段、備案、點餐句子、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="ld-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/late-night-dessert.js?v=20260525manual1"></script>
</body>
</html>
