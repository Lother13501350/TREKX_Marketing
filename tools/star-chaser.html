<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星空追逐卡｜ChillOut 旅行小工具 T038</title>
  <meta name="description" content="用雲量、月亮亮度、光害、移動時間與候選觀星點，判斷今晚值不值得追星，生成最佳出發窗、備案、分享文與 ChillOut prompt。">
  <meta property="og:title" content="星空追逐卡｜ChillOut 旅行小工具 T038">
  <meta property="og:description" content="追星空要浪漫，也要備案。用一張卡判斷今晚要不要出發。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/star-chaser.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/star-chaser.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/star-chaser.html">
  <link rel="stylesheet" href="../assets/star-chaser.css?v=20260525manual1">
</head>
<body class="sc-app">
  <header class="sc-nav">
    <a class="sc-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="sc-mark">C</span>
      <span><strong>ChillOut</strong><small>T038 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_star_chaser_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="sc-hero">
      <div class="sc-hero-copy">
        <p class="sc-kicker">T038 · stargazing go/no-go</p>
        <h1>想追星空，先判斷今晚是不是值得出城。</h1>
        <p>這個工具不假裝自己是天氣台。你輸入已知條件：雲量、月亮亮度、光害、可移動時間和候選點，它會幫你決定今晚該追星、改拍夜景，還是留在市區。</p>
      </div>
      <figure class="sc-visual">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1100&q=80" alt="夜晚山景與星空">
      </figure>
    </section>

    <section class="sc-workbench" aria-label="星空追逐卡操作區">
      <aside class="sc-settings" aria-label="今晚天空條件">
        <p class="sc-kicker">Sky conditions</p>
        <h2>今晚條件</h2>
        <label>
          城市 / 住宿區
          <input data-city value="台東市區" placeholder="例如：清境、濟州、富士河口湖">
        </label>
        <div class="sc-two">
          <label>
            可出發時間
            <input data-start type="time" value="20:30">
          </label>
          <label>
            最晚回到住宿
            <input data-return type="time" value="00:10">
          </label>
        </div>
        <label>
          回程方式
          <select data-return-mode>
            <option value="car">自駕 / 包車</option>
            <option value="taxi">叫車</option>
            <option value="tour">當地行程接送</option>
            <option value="unknown">尚未確定</option>
          </select>
        </label>
        <label class="sc-range">
          <span>雲量 <strong data-cloud-label>36/100</strong></span>
          <input data-cloud type="range" min="0" max="100" value="36">
        </label>
        <label class="sc-range">
          <span>月亮亮度 <strong data-moon-label>28/100</strong></span>
          <input data-moon type="range" min="0" max="100" value="28">
        </label>
        <label class="sc-range">
          <span>最多移動 <strong data-drive-label>45 分鐘</strong></span>
          <input data-drive type="range" min="10" max="120" value="45">
        </label>
        <div class="sc-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-spot>新增觀星點</button>
        </div>
      </aside>

      <section class="sc-spots" aria-label="候選觀星點">
        <div class="sc-spot-head">
          <div>
            <p class="sc-kicker">Candidate spots</p>
            <h2>候選觀星點</h2>
          </div>
          <button type="button" class="sc-primary" data-generate>生成追逐卡</button>
        </div>
        <div class="sc-spot-list" data-spots></div>
      </section>
    </section>

    <section class="sc-output" data-output aria-live="polite">
      <div class="sc-empty">
        <p class="sc-kicker">Result</p>
        <h2>先輸入天空條件與候選點，這裡會生成星空追逐卡。</h2>
        <p>結果會包含追星可行度、最佳點、出發窗、備案、分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="sc-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/star-chaser.js?v=20260525manual1"></script>
</body>
</html>
