<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轉機城市卡｜ChillOut 旅行小工具 T045</title>
  <meta name="description" content="T045 手寫版。輸入轉機時數、通關保守度、行李狀態與想做的事，判斷這次轉機該出境快閃、只做一件事，還是安心留在機場。">
  <meta property="og:title" content="轉機城市卡｜ChillOut 旅行小工具 T045">
  <meta property="og:description" content="把 4 到 12 小時轉機變成一張可分享的城市試吃券，附回程安全線與 ChillOut 行程 prompt。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/airport-layover-card.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/airport-layover-card-manual.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/airport-layover-card.html">
  <link rel="stylesheet" href="../assets/airport-layover-card.css?v=20260525manual1">
</head>
<body class="al-app">
  <header class="al-nav">
    <a class="al-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="al-mark">C</span>
      <span><strong>ChillOut</strong><small>T045 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_airport_layover_card_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="al-hero">
      <div class="al-hero-text">
        <p class="al-kicker">T045 / Airport layover card</p>
        <h1>轉機不是空白時間，是一張城市試吃券。</h1>
        <p>把轉機時數、簽證狀態、通關壓力、行李與想做的事放進來，工具會替你判斷能不能出境、只適合做一件事，或該留在機場把精神補滿。</p>
      </div>
      <figure class="al-hero-image">
        <img src="../assets/tool-posters/airport-layover-card-manual.svg" alt="轉機城市卡登機證視覺">
      </figure>
    </section>

    <section class="al-workbench" aria-label="轉機城市卡操作區">
      <aside class="al-settings" aria-label="轉機條件">
        <p class="al-kicker">Flight window</p>
        <h2>先抓安全邊界</h2>
        <label>轉機機場 / 城市
          <input data-airport value="仁川 ICN" placeholder="例如：新加坡 SIN、東京 NRT、伊斯坦堡 IST">
        </label>
        <div class="al-two">
          <label>轉機總時數
            <select data-layover>
              <option value="4.5">4.5 小時</option>
              <option value="6" selected>6 小時</option>
              <option value="8">8 小時</option>
              <option value="10">10 小時</option>
              <option value="12">12 小時以上</option>
            </select>
          </label>
          <label>下段登機前緩衝
            <select data-buffer>
              <option value="60">60 分鐘</option>
              <option value="90" selected>90 分鐘</option>
              <option value="120">120 分鐘</option>
              <option value="150">150 分鐘</option>
            </select>
          </label>
        </div>
        <label>入境狀態
          <select data-entry>
            <option value="free" selected>確定可免簽 / 落地入境</option>
            <option value="document">需要文件但已準備好</option>
            <option value="unclear">不確定規則</option>
            <option value="blocked">不可入境 / 不想冒險</option>
          </select>
        </label>
        <label>行李狀態
          <select data-luggage>
            <option value="checked" selected>行李直掛，身上很輕</option>
            <option value="carry">只有登機箱</option>
            <option value="large">大行李在身邊</option>
          </select>
        </label>
        <label>往返城市交通
          <select data-transport>
            <option value="rail" selected>機場快線 / 直達電車</option>
            <option value="metro">地鐵轉乘</option>
            <option value="taxi">計程車 / 共乘</option>
            <option value="airport">不離開機場</option>
          </select>
        </label>
        <label class="al-range"><span>通關摩擦 <strong data-immigration-label>45/100</strong></span><input data-immigration type="range" min="5" max="95" value="45"></label>
        <label class="al-range"><span>冒險意願 <strong data-risk-label>58/100</strong></span><input data-risk type="range" min="1" max="100" value="58"></label>
        <div class="al-actions">
          <button type="button" data-sample>帶入範例</button>
          <button type="button" class="al-primary" data-generate>生成城市卡</button>
        </div>
      </aside>

      <section class="al-builder" aria-label="想把轉機換成什麼">
        <div class="al-builder-head">
          <div>
            <p class="al-kicker">Layover appetite</p>
            <h2>選你想換到的城市味道</h2>
          </div>
          <button type="button" data-reset>清空重選</button>
        </div>
        <div class="al-interest-grid" data-interests></div>
      </section>
    </section>

    <section class="al-output" data-output aria-live="polite">
      <div class="al-empty">
        <p class="al-kicker">Result</p>
        <h2>先設定轉機條件，再生成一張可分享的城市卡。</h2>
        <p>結果會包含可行度、實際可用分鐘、建議玩法、不可踩的紅線、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="al-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/airport-layover-card.js?v=20260525manual1"></script>
</body>
</html>
