<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動態牆第一天行程｜ChillOut 旅行小工具 T008</title>
  <meta name="description" content="把今天滑到的 IG、Reels、小紅書靈感整理成抵達後第一天能真的走的低壓路線，並產生 ChillOut 行程 prompt。">
  <meta property="og:title" content="動態牆第一天行程｜ChillOut">
  <meta property="og:description" content="把滑到的靈感，排成落地第一天。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/feed-to-first-day.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/feed-to-first-day.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/feed-to-first-day.html">
  <link rel="stylesheet" href="../assets/feed-to-first-day.css?v=20260525manual1">
</head>
<body class="first-day-app">
  <header class="fd-topbar">
    <a class="fd-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="fd-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T008 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_feed_to_first_day_nav">下載 App</a>
    </nav>
  </header>

  <main class="fd-page">
    <section class="fd-hero">
      <p class="fd-eyebrow">Feed to first day</p>
      <h1>把滑到的靈感，排成落地第一天。</h1>
      <p>出國前滑到一堆店、景點、夜景和咖啡廳，但第一天最怕太貪心。貼上 3 到 8 個靈感，工具會排成抵達後不崩潰的第一天路線。</p>
    </section>

    <section class="fd-tool" aria-label="動態牆第一天行程操作區">
      <form class="fd-control" data-form>
        <div class="fd-control-head">
          <span>01</span>
          <h2>先把今天滑到的東西倒進來</h2>
        </div>

        <label class="fd-field">
          <span>目的地</span>
          <input data-city value="首爾" autocomplete="off">
        </label>

        <div class="fd-two">
          <label class="fd-field">
            <span>抵達時段</span>
            <select data-arrival>
              <option value="morning">上午抵達</option>
              <option value="afternoon" selected>下午抵達</option>
              <option value="night">晚上抵達</option>
            </select>
          </label>
          <label class="fd-field">
            <span>第一天體力</span>
            <select data-energy>
              <option value="gentle" selected>低壓，只想順</option>
              <option value="normal">正常，可以走</option>
              <option value="photo">想拍照，有精神</option>
            </select>
          </label>
        </div>

        <label class="fd-field">
          <span>第一餐偏好</span>
          <input data-meal value="市場小吃或烤肉" autocomplete="off">
        </label>

        <label class="fd-field">
          <span>動態牆靈感</span>
          <textarea data-feed spellcheck="false" placeholder="每行一個：店名、Reels、截圖文字或景點"></textarea>
        </label>

        <div class="fd-actions">
          <button class="fd-button" type="button" data-sample>載入示範</button>
          <button class="fd-button fd-primary" type="submit">生成第一天</button>
        </div>
      </form>

      <section class="fd-board" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="fd-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/feed-to-first-day.js?v=20260525manual1"></script>
</body>
</html>
