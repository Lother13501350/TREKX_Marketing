<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>房型能量測驗｜ChillOut 旅行小工具 T018</title>
  <meta name="description" content="從睡眠、位置、景觀、浴缸、工作、行李、預算和行程強度，反推出住宿房型優先順序與 ChillOut 訂房 prompt。">
  <meta property="og:title" content="房型能量測驗｜ChillOut">
  <meta property="og:description" content="住宿不是配角，它會決定你有沒有力氣玩。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/hotel-room-energy.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/hotel-room-energy.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/hotel-room-energy.html">
  <link rel="stylesheet" href="../assets/hotel-room-energy.css?v=20260525manual1">
</head>
<body class="hotel-app">
  <header class="hr-topbar">
    <a class="hr-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="hr-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T018 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_hotel_room_energy_nav">下載 App</a>
    </nav>
  </header>

  <main class="hr-page">
    <section class="hr-hero">
      <p class="hr-eyebrow">Hotel room energy test</p>
      <h1>住宿不是配角，它會決定你有沒有力氣玩。</h1>
      <p>訂房不是只比價格。這個工具會把你的睡眠需求、位置壓力、行程強度和恢復方式整理成房型優先順序，幫你知道錢該花在哪裡。</p>
    </section>

    <section class="hr-tool" aria-label="房型能量測驗操作區">
      <form class="hr-form" data-form>
        <div class="hr-grid">
          <label class="hr-field">
            <span>目的地</span>
            <input data-city value="台北" autocomplete="off">
          </label>
          <label class="hr-field">
            <span>住宿晚數</span>
            <input data-nights type="number" min="1" max="14" value="3">
          </label>
        </div>

        <label class="hr-range">
          <span>睡眠重要度 <strong data-value="sleep">86</strong></span>
          <input data-sleep type="range" min="0" max="100" value="86">
        </label>
        <label class="hr-range">
          <span>地點便利度 <strong data-value="location">78</strong></span>
          <input data-location type="range" min="0" max="100" value="78">
        </label>
        <label class="hr-range">
          <span>景觀 / 設計感 <strong data-value="view">48</strong></span>
          <input data-view type="range" min="0" max="100" value="48">
        </label>
        <label class="hr-range">
          <span>浴缸 / 放鬆需求 <strong data-value="bath">62</strong></span>
          <input data-bath type="range" min="0" max="100" value="62">
        </label>

        <div class="hr-grid">
          <label class="hr-field">
            <span>行程強度</span>
            <select data-intensity>
              <option value="low">慢旅</option>
              <option value="mid" selected>正常走</option>
              <option value="high">每天很滿</option>
            </select>
          </label>
          <label class="hr-field">
            <span>預算策略</span>
            <select data-budget>
              <option value="save">省住宿</option>
              <option value="balance" selected>平衡</option>
              <option value="invest">願意花在房間</option>
            </select>
          </label>
        </div>

        <div class="hr-checks">
          <label><input data-work type="checkbox"> 需要在房間工作或剪片</label>
          <label><input data-luggage type="checkbox" checked> 行李會比較多</label>
          <label><input data-noise type="checkbox" checked> 怕吵，隔音很重要</label>
        </div>

        <div class="hr-actions">
          <button class="hr-button" type="button" data-sample>載入示範</button>
          <button class="hr-button hr-primary" type="submit">排序房型需求</button>
        </div>
      </form>

      <section class="hr-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="hr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/hotel-room-energy.js?v=20260525manual1"></script>
</body>
</html>
