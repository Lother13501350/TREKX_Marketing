<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行李箱人格｜ChillOut 旅行小工具 T015</title>
  <meta name="description" content="用旅行天數、氣候、洗衣條件、穿搭與備品傾向診斷行李箱人格，產生必帶、可刪與 ChillOut 出發清單 prompt。">
  <meta property="og:title" content="行李箱人格｜ChillOut">
  <meta property="og:description" content="你的行李箱比你更誠實。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/packing-personality.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/packing-personality.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/packing-personality.html">
  <link rel="stylesheet" href="../assets/packing-personality.css?v=20260525manual1">
</head>
<body class="packing-app">
  <header class="pp-topbar">
    <a class="pp-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="pp-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T015 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_packing_personality_nav">下載 App</a>
    </nav>
  </header>

  <main class="pp-page">
    <section class="pp-hero">
      <p class="pp-eyebrow">Packing personality scanner</p>
      <h1>你的行李箱，比你更誠實。</h1>
      <p>這不是單純打包清單。它會看旅行天數、氣候、洗衣條件、穿搭和備品習慣，幫你判斷行李風險，整理成必帶、可刪、需要補的出發清單。</p>
    </section>

    <section class="pp-workbench" aria-label="行李箱人格操作區">
      <form class="pp-form" data-form>
        <div class="pp-grid">
          <label class="pp-field">
            <span>旅行天數</span>
            <input data-days type="number" min="1" max="30" value="5">
          </label>
          <label class="pp-field">
            <span>行李尺寸</span>
            <select data-bag>
              <option value="carry" selected>登機箱</option>
              <option value="medium">24 吋行李箱</option>
              <option value="large">28 吋以上</option>
            </select>
          </label>
        </div>

        <div class="pp-grid">
          <label class="pp-field">
            <span>氣候</span>
            <select data-weather>
              <option value="warm">溫暖</option>
              <option value="mixed" selected>早晚溫差大</option>
              <option value="cold">寒冷</option>
              <option value="rain">容易下雨</option>
            </select>
          </label>
          <label class="pp-field">
            <span>洗衣條件</span>
            <select data-laundry>
              <option value="yes">會洗衣</option>
              <option value="maybe" selected>不確定</option>
              <option value="no">不洗衣</option>
            </select>
          </label>
        </div>

        <label class="pp-field">
          <span>穿搭策略</span>
          <select data-outfit>
            <option value="minimal">少量百搭</option>
            <option value="photo" selected>每天都要有畫面</option>
            <option value="comfort">舒服第一</option>
          </select>
        </label>

        <label class="pp-field">
          <span>備品習慣</span>
          <select data-backup>
            <option value="low">只帶剛好</option>
            <option value="medium" selected>重要東西會備用</option>
            <option value="high">什麼都想多帶一份</option>
          </select>
        </label>

        <label class="pp-field">
          <span>已想到要帶的東西</span>
          <textarea data-items spellcheck="false" placeholder="每行一個：相機、外套、藥品、轉接頭、保養品"></textarea>
        </label>

        <div class="pp-checks">
          <label><input data-tech type="checkbox" checked> 需要拍照/筆電/多個充電設備</label>
          <label><input data-meds type="checkbox" checked> 需要常備藥或保健品</label>
          <label><input data-souvenir type="checkbox"> 想留伴手禮空間</label>
        </div>

        <div class="pp-actions">
          <button class="pp-button" type="button" data-sample>載入示範</button>
          <button class="pp-button pp-primary" type="submit">診斷行李箱</button>
        </div>
      </form>

      <section class="pp-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="pp-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/packing-personality.js?v=20260525manual1"></script>
</body>
</html>
