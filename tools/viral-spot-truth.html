<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>爆紅景點真相卡｜ChillOut 旅行小工具 T009</title>
  <meta name="description" content="輸入爆紅景點、期待與最怕踩雷的點，產出人潮真相、適合時段、替代玩法與 ChillOut 行程 prompt。">
  <meta property="og:title" content="爆紅景點真相卡｜ChillOut">
  <meta property="og:description" content="漂亮照片背後，需要一張真相卡。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/viral-spot-truth.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/viral-spot-truth.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/viral-spot-truth.html">
  <link rel="stylesheet" href="../assets/viral-spot-truth.css?v=20260525manual1">
</head>
<body class="truth-app">
  <header class="vt-topbar">
    <a class="vt-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="vt-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T009 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_viral_spot_truth_nav">下載 App</a>
    </nav>
  </header>

  <main class="vt-page">
    <section class="vt-hero">
      <p class="vt-eyebrow">Viral spot truth card</p>
      <h1>照片很美，不代表你該照著去。</h1>
      <p>把你看到的爆紅景點放進來，先看人潮、交通、排隊和照片落差，再決定要原地去、換時段去，或改成更聰明的替代玩法。</p>
    </section>

    <section class="vt-lab" aria-label="爆紅景點真相卡操作區">
      <form class="vt-form" data-form>
        <label class="vt-field">
          <span>爆紅景點或店名</span>
          <input data-spot value="南山塔夜景角度" autocomplete="off">
        </label>

        <label class="vt-field">
          <span>你被哪裡燒到</span>
          <input data-expect value="想拍到像 Reels 一樣乾淨的夜景照片" autocomplete="off">
        </label>

        <div class="vt-grid">
          <label class="vt-field">
            <span>來源</span>
            <select data-source>
              <option value="reels" selected>IG / Reels</option>
              <option value="xiaohongshu">小紅書</option>
              <option value="friend">朋友推薦</option>
              <option value="blog">部落格 / Google</option>
            </select>
          </label>
          <label class="vt-field">
            <span>最怕踩雷</span>
            <select data-risk>
              <option value="crowd" selected>人潮太多</option>
              <option value="queue">排隊太久</option>
              <option value="transport">交通太繞</option>
              <option value="photo">照片落差</option>
            </select>
          </label>
        </div>

        <label class="vt-field">
          <span>同行狀態</span>
          <select data-party>
            <option value="couple">情侶 / 兩人</option>
            <option value="friends" selected>朋友小團</option>
            <option value="family">親子 / 長輩</option>
            <option value="solo">一個人</option>
          </select>
        </label>

        <div class="vt-actions">
          <button class="vt-button" type="button" data-sample>載入示範</button>
          <button class="vt-button vt-primary" type="submit">生成真相卡</button>
        </div>
      </form>

      <section class="vt-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="vt-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/viral-spot-truth.js?v=20260525manual1"></script>
</body>
</html>
