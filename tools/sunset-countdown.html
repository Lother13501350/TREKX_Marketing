<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日落倒數排程｜ChillOut 旅行小工具 T032</title>
  <meta name="description" content="輸入城市、日落時間、交通緩衝、天氣信心與觀景點，倒推出卡位、拍照黃金時間、晚餐收尾與 ChillOut prompt。">
  <meta property="og:title" content="日落倒數排程｜ChillOut">
  <meta property="og:description" content="好的日落不是碰運氣，是倒推安排。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/sunset-countdown.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/sunset-countdown.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/sunset-countdown.html">
  <link rel="stylesheet" href="../assets/sunset-countdown.css?v=20260525manual1">
</head>
<body class="sc-app">
  <header class="sc-topbar">
    <a class="sc-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="sc-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T032 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_sunset_countdown_nav">下載 App</a>
    </nav>
  </header>

  <main class="sc-page">
    <section class="sc-hero">
      <p class="sc-eyebrow">Sunset countdown</p>
      <h1>想看日落，就不要用出發時間排。</h1>
      <p>夕陽最常錯過的原因不是景點不好，而是低估交通、卡位和天氣備案。這個工具從日落時間往回倒推，把抵達、拍照、等待、晚餐全部排好。</p>
    </section>

    <section class="sc-layout" aria-label="日落倒數排程操作區">
      <aside class="sc-panel sc-settings">
        <form data-sunset-form>
          <label class="sc-field">
            <span>城市</span>
            <input data-city value="台南" autocomplete="off">
          </label>
          <div class="sc-two">
            <label class="sc-field">
              <span>日落時間</span>
              <input data-sunset type="time" value="18:22">
            </label>
            <label class="sc-field">
              <span>晚餐偏好</span>
              <select data-dinner>
                <option value="near" selected>附近晚餐</option>
                <option value="special">特地訂位</option>
                <option value="snack">小吃收尾</option>
              </select>
            </label>
          </div>
          <label class="sc-range">
            <span>天氣信心 <strong data-weather-value>64</strong></span>
            <input data-weather type="range" min="0" max="100" value="64">
          </label>
          <div class="sc-actions">
            <button type="button" class="sc-button" data-sample>載入示範</button>
            <button type="button" class="sc-button" data-add-spot>加觀景點</button>
          </div>
        </form>
      </aside>

      <section class="sc-panel sc-spots">
        <div class="sc-section-head">
          <div>
            <p class="sc-eyebrow">View spots</p>
            <h2>觀景點候選</h2>
          </div>
          <button type="button" class="sc-button sc-primary" data-generate>生成倒數</button>
        </div>
        <div class="sc-spot-list" data-spots></div>
      </section>

      <section class="sc-panel sc-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="sc-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/sunset-countdown.js?v=20260525manual1"></script>
</body>
</html>
