<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月光散步地圖｜ChillOut 旅行小工具 T033</title>
  <meta name="description" content="輸入城市、出門時間、安全保守度與候選散步段，生成低噪音、好回程、距離可控的月光散步路線與 ChillOut prompt。">
  <meta property="og:title" content="月光散步地圖｜ChillOut">
  <meta property="og:description" content="夜晚不是一定要熱鬧，也可以很溫柔。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/moonwalk-map.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/moonwalk-map.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/moonwalk-map.html">
  <link rel="stylesheet" href="../assets/moonwalk-map.css?v=20260525manual1">
</head>
<body class="mw-app">
  <header class="mw-topbar">
    <a class="mw-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="mw-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T033 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_moonwalk_map_nav">下載 App</a>
    </nav>
  </header>

  <main class="mw-page">
    <section class="mw-hero">
      <p class="mw-eyebrow">Moonwalk map</p>
      <h1>夜晚想慢慢走，就把距離和回程先排好。</h1>
      <p>月光散步不是硬塞景點，而是找一條安靜、漂亮、不趕路的路。這個工具用安全、照明、安靜度與距離，排出三段舒服的夜間散步。</p>
    </section>

    <section class="mw-layout" aria-label="月光散步地圖操作區">
      <aside class="mw-panel mw-settings">
        <form data-walk-form>
          <label class="mw-field">
            <span>城市</span>
            <input data-city value="京都" autocomplete="off">
          </label>
          <div class="mw-two">
            <label class="mw-field">
              <span>開始</span>
              <select data-start>
                <option value="19:00">19:00</option>
                <option value="20:00" selected>20:00</option>
                <option value="21:00">21:00</option>
              </select>
            </label>
            <label class="mw-field">
              <span>步行上限</span>
              <select data-limit>
                <option value="2">2 km</option>
                <option value="3" selected>3 km</option>
                <option value="5">5 km</option>
              </select>
            </label>
          </div>
          <label class="mw-range">
            <span>安全保守度 <strong data-safety-value>78</strong></span>
            <input data-safety type="range" min="0" max="100" value="78">
          </label>
          <div class="mw-actions">
            <button type="button" class="mw-button" data-sample>載入示範</button>
            <button type="button" class="mw-button" data-add-segment>加散步段</button>
          </div>
        </form>
      </aside>

      <section class="mw-panel mw-segments">
        <div class="mw-section-head">
          <div>
            <p class="mw-eyebrow">Walk segments</p>
            <h2>候選散步段</h2>
          </div>
          <button type="button" class="mw-button mw-primary" data-generate>生成散步地圖</button>
        </div>
        <div class="mw-segment-list" data-segments></div>
      </section>

      <section class="mw-panel mw-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="mw-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/moonwalk-map.js?v=20260525manual1"></script>
</body>
</html>
