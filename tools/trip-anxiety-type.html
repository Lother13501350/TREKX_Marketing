<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行焦慮類型｜ChillOut 旅行小工具 T020</title>
  <meta name="description" content="把交通、天氣、預算、語言、網路、行程、食物與安全感的不安排序，產生可執行備案卡與 ChillOut prompt。">
  <meta property="og:title" content="旅行焦慮類型｜ChillOut">
  <meta property="og:description" content="焦慮不是敵人，它是在提醒你需要備案。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/trip-anxiety-type.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/trip-anxiety-type.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/trip-anxiety-type.html">
  <link rel="stylesheet" href="../assets/trip-anxiety-type.css?v=20260525manual1">
</head>
<body class="anxiety-app">
  <header class="ta-topbar">
    <a class="ta-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="ta-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T020 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_trip_anxiety_type_nav">下載 App</a>
    </nav>
  </header>

  <main class="ta-page">
    <section class="ta-hero">
      <p class="ta-eyebrow">Travel anxiety backup card</p>
      <h1>焦慮不是敵人，它是在提醒你需要備案。</h1>
      <p>出發前的不安如果只放在腦中會變大。把它拆成八個來源，工具會排出最需要先處理的風險，轉成具體備案卡。</p>
    </section>

    <section class="ta-tool" aria-label="旅行焦慮類型操作區">
      <form class="ta-form" data-form>
        <div class="ta-grid">
          <label class="ta-field">
            <span>目的地</span>
            <input data-city value="釜山" autocomplete="off">
          </label>
          <label class="ta-field">
            <span>旅行天數</span>
            <input data-days type="number" min="1" max="21" value="4">
          </label>
        </div>

        <label class="ta-range"><span>交通不安 <strong data-value="transport">72</strong></span><input data-transport type="range" min="0" max="100" value="72"></label>
        <label class="ta-range"><span>天氣不安 <strong data-value="weather">58</strong></span><input data-weather type="range" min="0" max="100" value="58"></label>
        <label class="ta-range"><span>預算不安 <strong data-value="budget">46</strong></span><input data-budget type="range" min="0" max="100" value="46"></label>
        <label class="ta-range"><span>語言不安 <strong data-value="language">64</strong></span><input data-language type="range" min="0" max="100" value="64"></label>
        <label class="ta-range"><span>網路/手機不安 <strong data-value="data">70</strong></span><input data-data type="range" min="0" max="100" value="70"></label>
        <label class="ta-range"><span>行程失控不安 <strong data-value="schedule">82</strong></span><input data-schedule type="range" min="0" max="100" value="82"></label>
        <label class="ta-range"><span>食物不安 <strong data-value="food">36</strong></span><input data-food type="range" min="0" max="100" value="36"></label>
        <label class="ta-range"><span>安全感不安 <strong data-value="safety">60</strong></span><input data-safety type="range" min="0" max="100" value="60"></label>

        <label class="ta-field">
          <span>同行狀態</span>
          <select data-party>
            <option value="solo">一個人</option>
            <option value="couple" selected>兩人</option>
            <option value="group">朋友小團</option>
            <option value="family">親子 / 長輩</option>
          </select>
        </label>

        <div class="ta-actions">
          <button class="ta-button" type="button" data-sample>載入示範</button>
          <button class="ta-button ta-primary" type="submit">生成備案卡</button>
        </div>
      </form>

      <section class="ta-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="ta-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/trip-anxiety-type.js?v=20260525manual1"></script>
</body>
</html>
