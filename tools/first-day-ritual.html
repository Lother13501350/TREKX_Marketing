<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第一日儀式測驗｜ChillOut 旅行小工具 T019</title>
  <meta name="description" content="依抵達時段、睡眠債、交通、行李、飢餓與第一天期待，產生落地後 180 分鐘開場儀式與 ChillOut prompt。">
  <meta property="og:title" content="第一日儀式測驗｜ChillOut">
  <meta property="og:description" content="第一天的任務，是讓旅行順利開始。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/first-day-ritual.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/first-day-ritual.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/first-day-ritual.html">
  <link rel="stylesheet" href="../assets/first-day-ritual.css?v=20260525manual1">
</head>
<body class="ritual-app">
  <header class="fr-topbar">
    <a class="fr-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="fr-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T019 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_first_day_ritual_nav">下載 App</a>
    </nav>
  </header>

  <main class="fr-page">
    <section class="fr-hero">
      <p class="fr-eyebrow">First day ritual builder</p>
      <h1>第一天的任務，是讓旅行順利開始。</h1>
      <p>落地第一天最容易失控。這個工具不會叫你塞滿景點，而是幫你安排抵達後 180 分鐘：先穩住、再吃、再開始旅行。</p>
    </section>

    <section class="fr-tool" aria-label="第一日儀式測驗操作區">
      <form class="fr-form" data-form>
        <div class="fr-grid">
          <label class="fr-field">
            <span>目的地</span>
            <input data-city value="曼谷" autocomplete="off">
          </label>
          <label class="fr-field">
            <span>抵達時段</span>
            <select data-arrival>
              <option value="morning">上午</option>
              <option value="afternoon" selected>下午</option>
              <option value="night">晚上</option>
            </select>
          </label>
        </div>

        <label class="fr-range">
          <span>睡眠債 <strong data-value="sleepDebt">68</strong></span>
          <input data-sleep-debt type="range" min="0" max="100" value="68">
        </label>
        <label class="fr-range">
          <span>交通壓力 <strong data-value="transfer">62</strong></span>
          <input data-transfer type="range" min="0" max="100" value="62">
        </label>
        <label class="fr-range">
          <span>行李負擔 <strong data-value="luggage">54</strong></span>
          <input data-luggage type="range" min="0" max="100" value="54">
        </label>
        <label class="fr-range">
          <span>飢餓程度 <strong data-value="hunger">76</strong></span>
          <input data-hunger type="range" min="0" max="100" value="76">
        </label>

        <div class="fr-grid">
          <label class="fr-field">
            <span>住宿 check-in</span>
            <select data-checkin>
              <option value="ready">可直接入住</option>
              <option value="later" selected>還要等</option>
              <option value="unknown">不確定</option>
            </select>
          </label>
          <label class="fr-field">
            <span>第一天期待</span>
            <select data-wish>
              <option value="food" selected>先吃到安心</option>
              <option value="scene">先看到城市</option>
              <option value="rest">先恢復體力</option>
              <option value="social">先跟旅伴進入狀態</option>
            </select>
          </label>
        </div>

        <label class="fr-field">
          <span>第一餐偏好</span>
          <input data-meal value="舒服的熱食或在地小吃" autocomplete="off">
        </label>

        <div class="fr-actions">
          <button class="fr-button" type="button" data-sample>載入示範</button>
          <button class="fr-button fr-primary" type="submit">生成第一日儀式</button>
        </div>
      </form>

      <section class="fr-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="fr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/first-day-ritual.js?v=20260525manual1"></script>
</body>
</html>
