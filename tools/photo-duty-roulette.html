<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拍照任務輪盤｜ChillOut 旅行小工具 T029</title>
  <meta name="description" content="依旅伴的拍照耐心、掌鏡能力、出鏡意願與拍照點，生成攝影師、導演、側拍、限動發布與休息者分工。">
  <meta property="og:title" content="拍照任務輪盤｜ChillOut">
  <meta property="og:description" content="好照片需要分工，不需要互相嫌棄。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/photo-duty-roulette.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/photo-duty-roulette.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/photo-duty-roulette.html">
  <link rel="stylesheet" href="../assets/photo-duty-roulette.css?v=20260525manual1">
</head>
<body class="pr-app">
  <header class="pr-topbar">
    <a class="pr-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="pr-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T029 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_photo_duty_roulette_nav">下載 App</a>
    </nav>
  </header>

  <main class="pr-page">
    <section class="pr-hero">
      <p class="pr-eyebrow">Photo duty roulette</p>
      <h1>拍照不是誰比較會忍耐，任務要輪流。</h1>
      <p>有人想拍一百張，有人拍三張就累。這個工具把掌鏡能力、拍照耐心、出鏡意願與拍照點排成任務輪盤，讓每一站都有攝影師、導演、側拍、發布者與休息者。</p>
    </section>

    <section class="pr-layout" aria-label="拍照任務輪盤操作區">
      <aside class="pr-panel pr-settings">
        <form data-photo-form>
          <label class="pr-field">
            <span>旅行主題</span>
            <input data-trip value="釜山海邊拍照日" autocomplete="off">
          </label>
          <label class="pr-field">
            <span>輪替原則</span>
            <select data-policy>
              <option value="fair" selected>平均輪替</option>
              <option value="skill">會拍的人多掌鏡</option>
              <option value="rest">耐心低的人多休息</option>
            </select>
          </label>
          <label class="pr-range">
            <span>重拍容忍度 <strong data-retake-value>44</strong></span>
            <input data-retake type="range" min="0" max="100" value="44">
          </label>
          <div class="pr-actions">
            <button type="button" class="pr-button" data-sample>載入示範</button>
            <button type="button" class="pr-button" data-add-person>加旅伴</button>
            <button type="button" class="pr-button" data-add-spot>加拍點</button>
          </div>
        </form>
      </aside>

      <section class="pr-panel pr-people">
        <div class="pr-section-head">
          <div>
            <p class="pr-eyebrow">Crew</p>
            <h2>拍照能力與耐心</h2>
          </div>
        </div>
        <div class="pr-people-list" data-people></div>
      </section>

      <section class="pr-panel pr-spots">
        <div class="pr-section-head">
          <div>
            <p class="pr-eyebrow">Photo stops</p>
            <h2>拍照點</h2>
          </div>
          <button type="button" class="pr-button pr-primary" data-generate>生成輪盤</button>
        </div>
        <div class="pr-spot-list" data-spots></div>
      </section>

      <section class="pr-panel pr-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="pr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/photo-duty-roulette.js?v=20260525manual1"></script>
</body>
</html>
