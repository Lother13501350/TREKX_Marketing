<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三張截圖路線工坊｜ChillOut 旅行小工具 T002</title>
  <meta name="description" content="上傳或描述三張旅遊截圖，將它們拼成一條可出發的半日或一日路線，並產生 ChillOut prompt。">
  <meta property="og:title" content="三張截圖路線工坊｜把截圖拼成路線">
  <meta property="og:description" content="三張截圖、三個線索，一鍵拼成路線、分享文案與 ChillOut prompt。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/screenshot-to-route.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/screenshot-to-route.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/screenshot-to-route.html">
  <link rel="stylesheet" href="../assets/screenshot-route.css?v=20260525a">
</head>
<body class="screenshot-route-app">
  <header class="sr-top">
    <a class="sr-brand" href="../travel-microtools-100.html">
      <span class="sr-mark">C</span>
      <span><strong>ChillOut</strong><small>T002 三張截圖路線工坊</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_screenshot_route_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="sr-hero">
      <div>
        <p class="sr-kicker">T002 · screenshot route builder</p>
        <h1>三張截圖路線工坊</h1>
        <p>不要再讓旅遊截圖躺在相簿裡。把三張截圖變成三個路線節點，排出順序、時間、交通節奏與 ChillOut prompt。</p>
        <div class="sr-actions">
          <button class="sr-button primary" data-demo>載入示範截圖</button>
          <a class="sr-button" href="#workshop">開始拼路線</a>
          <a class="sr-button" href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_screenshot_route_hero">下載 ChillOut</a>
        </div>
      </div>
      <div class="sr-contact-sheet" aria-label="三張截圖示意">
        <figure class="sr-frame"><div>A</div><span>先定錨</span></figure>
        <figure class="sr-frame"><div>B</div><span>再轉場</span></figure>
        <figure class="sr-frame"><div>C</div><span>最後收尾</span></figure>
      </div>
    </section>

    <section class="sr-workbench" id="workshop">
      <aside class="sr-inputs">
        <div class="sr-panel-title">
          <h2>三張截圖</h2>
          <small>可上傳圖，也可只填描述</small>
        </div>
        <div class="sr-shot-editor" data-shot-editors></div>
        <button class="sr-button primary full" data-build-route>重排路線</button>
      </aside>

      <section class="sr-stage">
        <div class="sr-panel-title">
          <h2>路線拼接台</h2>
          <small>三個節點形成一條路線</small>
        </div>

        <div class="sr-settings">
          <label>目的地<input data-city value="首爾"></label>
          <label>起始時間
            <select data-start>
              <option>09:00</option>
              <option selected>10:00</option>
              <option>13:00</option>
              <option>16:00</option>
            </select>
          </label>
          <label>節奏
            <select data-pace>
              <option>慢拍</option>
              <option selected>剛好</option>
              <option>緊湊</option>
            </select>
          </label>
          <label>交通
            <select data-transport>
              <option selected>步行優先</option>
              <option>大眾運輸</option>
              <option>計程車可用</option>
            </select>
          </label>
        </div>

        <div class="sr-map" data-route-map></div>

        <div class="sr-output-grid">
          <section class="sr-route" data-route-output></section>
          <aside class="sr-card" data-result-card></aside>
        </div>
      </section>
    </section>
  </main>

  <div class="sr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/screenshot-route.js?v=20260525a"></script>
</body>
</html>
