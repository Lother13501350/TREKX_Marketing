<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朋友丟連結收件箱｜ChillOut 旅行小工具 T007</title>
  <meta name="description" content="把朋友丟來的旅行連結、店名與 Reels 整理成必排、備用、刪掉三桶，分配負責人並產生 ChillOut 行程 prompt。">
  <meta property="og:title" content="朋友丟連結收件箱｜ChillOut">
  <meta property="og:description" content="群組裡的旅遊連結，一鍵整理成可出發清單。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/friend-link-inbox.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/friend-link-inbox.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/friend-link-inbox.html">
  <link rel="stylesheet" href="../assets/friend-link-inbox.css?v=20260525manual1">
</head>
<body class="friend-inbox-app">
  <header class="fi-topbar">
    <a class="fi-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="fi-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T007 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_friend_link_inbox_nav">下載 App</a>
    </nav>
  </header>

  <main class="fi-shell">
    <section class="fi-hero">
      <p class="fi-eyebrow">Group link inbox</p>
      <h1>朋友一直丟連結，但沒人整理。</h1>
      <p>把群組裡的 IG、地圖連結、店名和截圖文字貼進來。工具會幫你分出必排、備用、刪掉，並把每個點分配給適合負責的人。</p>
    </section>

    <section class="fi-workbench" aria-label="朋友丟連結收件箱操作區">
      <form class="fi-input" data-form>
        <label class="fi-field">
          <span>群組丟來的素材</span>
          <textarea data-links spellcheck="false" placeholder="每行一個連結、店名或景點"></textarea>
        </label>
        <div class="fi-grid">
          <label class="fi-field">
            <span>旅伴名單</span>
            <input data-people value="我、阿哲、小雨、Mia" autocomplete="off">
          </label>
          <label class="fi-field">
            <span>整理策略</span>
            <select data-style>
              <option value="效率">效率優先</option>
              <option value="公平">每個人都顧到</option>
              <option value="低壓">不要排太滿</option>
            </select>
          </label>
        </div>
        <div class="fi-actions">
          <button class="fi-button" type="button" data-sample>載入示範</button>
          <button class="fi-button fi-primary" type="submit">整理收件箱</button>
        </div>
      </form>

      <section class="fi-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="fi-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/friend-link-inbox.js?v=20260525manual1"></script>
</body>
</html>
