<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>獨處社交排程器｜ChillOut 旅行小工具 T030</title>
  <meta name="description" content="輸入旅伴獨處需求、社交電量、錯過焦慮與共同活動，生成一起玩時段、分開行動時段、集合規則與 ChillOut prompt。">
  <meta property="og:title" content="獨處社交排程器｜ChillOut">
  <meta property="og:description" content="分開一下，不代表不想一起玩。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/solo-or-social.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/solo-or-social.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/solo-or-social.html">
  <link rel="stylesheet" href="../assets/solo-or-social.css?v=20260525manual1">
</head>
<body class="ss-app">
  <header class="ss-topbar">
    <a class="ss-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="ss-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T030 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_solo_or_social_nav">下載 App</a>
    </nav>
  </header>

  <main class="ss-page">
    <section class="ss-hero">
      <p class="ss-eyebrow">Solo social scheduler</p>
      <h1>多人旅行，也要有人可以自己喘口氣。</h1>
      <p>不是每個人都能從早到晚黏在一起。這個工具把獨處需求、社交電量、錯過焦慮與共同活動排成一張低摩擦時程，讓分開一下不再像拒絕朋友。</p>
    </section>

    <section class="ss-layout" aria-label="獨處社交排程器操作區">
      <aside class="ss-panel ss-settings">
        <form data-social-form>
          <label class="ss-field">
            <span>旅行日</span>
            <input data-trip value="東京第四天" autocomplete="off">
          </label>
          <label class="ss-field">
            <span>分開行動規則</span>
            <select data-policy>
              <option value="announce" selected>先講好再分開</option>
              <option value="free">自由分開不用解釋</option>
              <option value="pair">至少兩人一組</option>
            </select>
          </label>
          <label class="ss-range">
            <span>集合安全感 <strong data-safety-value>72</strong></span>
            <input data-safety type="range" min="0" max="100" value="72">
          </label>
          <div class="ss-actions">
            <button type="button" class="ss-button" data-sample>載入示範</button>
            <button type="button" class="ss-button" data-add-person>加旅伴</button>
            <button type="button" class="ss-button" data-add-activity>加活動</button>
          </div>
        </form>
      </aside>

      <section class="ss-panel ss-people">
        <div class="ss-section-head">
          <div>
            <p class="ss-eyebrow">Travelers</p>
            <h2>獨處與社交電量</h2>
          </div>
        </div>
        <div class="ss-people-list" data-people></div>
      </section>

      <section class="ss-panel ss-activities">
        <div class="ss-section-head">
          <div>
            <p class="ss-eyebrow">Shared plans</p>
            <h2>共同活動</h2>
          </div>
          <button type="button" class="ss-button ss-primary" data-generate>生成排程</button>
        </div>
        <div class="ss-activity-list" data-activities></div>
      </section>

      <section class="ss-panel ss-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="ss-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/solo-or-social.js?v=20260525manual1"></script>
</body>
</html>
