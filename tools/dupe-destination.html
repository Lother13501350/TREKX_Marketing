<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>替代目的地選擇器｜ChillOut 旅行小工具 T042</title>
  <meta name="description" content="找出同氛圍但更少人的替代目的地。輸入熱門景點、期待氛圍、人潮忍受與移動成本，生成去、改、跳過建議與 ChillOut prompt。">
  <meta property="og:title" content="替代目的地選擇器｜ChillOut 旅行小工具 T042">
  <meta property="og:description" content="有時候 dupe 才是真正適合你的夢幻點。把熱門點和替代點放在一起比較。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/dupe-destination.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/dupe-destination.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/dupe-destination.html">
  <link rel="stylesheet" href="../assets/dupe-destination.css?v=20260525manual1">
</head>
<body class="dd-app">
  <header class="dd-nav">
    <a class="dd-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="dd-mark">C</span>
      <span><strong>ChillOut</strong><small>T042 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_dupe_destination_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="dd-hero">
      <div class="dd-hero-copy">
        <p class="dd-kicker">T042 · destination dupe selector</p>
        <h1>想要熱門感，不一定要去最熱門的地方。</h1>
        <p>把原本想去的爆紅景點和幾個替代點放在一起比較。工具會保留你真正想要的氛圍，扣掉人潮、交通和成本，找出更適合今天的 dupe。</p>
      </div>
      <figure class="dd-visual">
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1100&q=80" alt="山城小路與替代目的地">
      </figure>
    </section>

    <section class="dd-workbench" aria-label="替代目的地選擇器操作區">
      <aside class="dd-settings" aria-label="比較條件">
        <p class="dd-kicker">Compare settings</p>
        <h2>比較條件</h2>
        <label>
          原本想去的熱門點
          <input data-target value="京都清水寺" placeholder="例如：九份老街、明洞、嵐山竹林">
        </label>
        <label>
          最想保留的氛圍
          <select data-vibe>
            <option value="oldstreet">老街與文化</option>
            <option value="view">景觀與拍照</option>
            <option value="food">美食密度</option>
            <option value="slow">慢逛與安靜</option>
            <option value="shopping">逛店與選物</option>
          </select>
        </label>
        <label class="dd-range">
          <span>可忍受人潮 <strong data-crowd-label>42/100</strong></span>
          <input data-crowd type="range" min="1" max="100" value="42">
        </label>
        <label class="dd-range">
          <span>願意繞路 <strong data-effort-label>55/100</strong></span>
          <input data-effort type="range" min="1" max="100" value="55">
        </label>
        <label class="dd-range">
          <span>拍照期待 <strong data-photo-label>72/100</strong></span>
          <input data-photo type="range" min="1" max="100" value="72">
        </label>
        <div class="dd-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-dupe>新增替代點</button>
        </div>
      </aside>

      <section class="dd-dupes" aria-label="替代點候選">
        <div class="dd-dupe-head">
          <div>
            <p class="dd-kicker">Dupe candidates</p>
            <h2>替代點候選</h2>
          </div>
          <button type="button" class="dd-primary" data-generate>生成比較建議</button>
        </div>
        <div class="dd-dupe-list" data-dupes></div>
      </section>
    </section>

    <section class="dd-output" data-output aria-live="polite">
      <div class="dd-empty">
        <p class="dd-kicker">Result</p>
        <h2>先放入替代點，這裡會生成去 / 改 / 跳過建議。</h2>
        <p>結果會包含最佳 dupe、比較理由、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="dd-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/dupe-destination.js?v=20260525manual1"></script>
</body>
</html>
