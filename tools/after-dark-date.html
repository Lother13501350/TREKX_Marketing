<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜景約會生成器｜ChillOut 旅行小工具 T040</title>
  <meta name="description" content="用城市、關係階段、預算、聊天能量、走路上限與候選約會段，生成低壓晚間約會節奏、邀約訊息、備案與 ChillOut prompt。">
  <meta property="og:title" content="夜景約會生成器｜ChillOut 旅行小工具 T040">
  <meta property="og:description" content="好的約會不靠塞滿，靠節奏。用低壓方式排一個晚上的城市約會。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/after-dark-date.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/after-dark-date.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/after-dark-date.html">
  <link rel="stylesheet" href="../assets/after-dark-date.css?v=20260525manual1">
</head>
<body class="ad-app">
  <header class="ad-nav">
    <a class="ad-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="ad-mark">C</span>
      <span><strong>ChillOut</strong><small>T040 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_after_dark_date_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="ad-hero">
      <div class="ad-hero-copy">
        <p class="ad-kicker">T040 · after dark date builder</p>
        <h1>晚上的約會，不需要很滿，需要有餘裕。</h1>
        <p>選城市、關係階段、預算和聊天能量，再放入候選約會段。工具會安排晚餐後散步、夜景、收尾和雨備，並產生可以直接傳出去的低壓邀約訊息。</p>
      </div>
      <figure class="ad-visual">
        <img src="https://images.unsplash.com/photo-1515890435782-59a5bb6ec191?auto=format&fit=crop&w=1100&q=80" alt="城市夜晚散步約會">
      </figure>
    </section>

    <section class="ad-workbench" aria-label="夜景約會生成器操作區">
      <aside class="ad-settings" aria-label="約會條件">
        <p class="ad-kicker">Date settings</p>
        <h2>今晚條件</h2>
        <label>
          城市 / 約會區域
          <input data-city value="台北信義區" placeholder="例如：首爾漢江、東京中目黑、台南中西區">
        </label>
        <div class="ad-two">
          <label>
            關係階段
            <select data-stage>
              <option value="first">第一次約會</option>
              <option value="early">曖昧初期</option>
              <option value="partner">穩定交往</option>
              <option value="anniversary">紀念日</option>
            </select>
          </label>
          <label>
            人均預算
            <input data-budget type="number" min="0" max="10000" value="1200">
          </label>
        </div>
        <label class="ad-range">
          <span>聊天能量 <strong data-talk-label>68/100</strong></span>
          <input data-talk type="range" min="1" max="100" value="68">
        </label>
        <label class="ad-range">
          <span>親密低壓度 <strong data-soft-label>74/100</strong></span>
          <input data-soft type="range" min="1" max="100" value="74">
        </label>
        <label class="ad-range">
          <span>走路上限 <strong data-walk-label>18 分鐘</strong></span>
          <input data-walk type="range" min="4" max="45" value="18">
        </label>
        <div class="ad-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-moment>新增約會段</button>
        </div>
      </aside>

      <section class="ad-moments" aria-label="候選約會段">
        <div class="ad-moment-head">
          <div>
            <p class="ad-kicker">Date moments</p>
            <h2>候選約會段</h2>
          </div>
          <button type="button" class="ad-primary" data-generate>生成約會節奏</button>
        </div>
        <div class="ad-moment-list" data-moments></div>
      </section>
    </section>

    <section class="ad-output" data-output aria-live="polite">
      <div class="ad-empty">
        <p class="ad-kicker">Result</p>
        <h2>先放入候選約會段，這裡會生成一晚低壓約會。</h2>
        <p>結果會包含節奏、邀約訊息、雨備、收尾方式與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="ad-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/after-dark-date.js?v=20260525manual1"></script>
</body>
</html>
