<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>爆紅景點值得嗎｜ChillOut 旅行小工具 T004</title>
  <meta name="description" content="輸入想去的爆紅景點、人潮耐受、期待值與替代意願，30 秒判斷要去、換時段去或改去替代點。">
  <meta property="og:title" content="爆紅景點值得嗎">
  <meta property="og:description" content="不要被熱門照片綁架。先判斷這個景點值不值得排進你的旅行。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/dupe-or-dream.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/dupe-or-dream.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/dupe-or-dream.html">
  <link rel="stylesheet" href="../assets/dupe-dream.css?v=20260525simple">
</head>
<body class="dupe-dream-app">
  <header class="dd-nav">
    <a class="dd-brand" href="../travel-microtools-100.html">
      <span class="dd-mark">C</span>
      <span><strong>ChillOut</strong><small>T004 爆紅景點值得嗎</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_dupe_dream_nav">下載 App</a>
    </nav>
  </header>

  <main class="dd-page">
    <section class="dd-hero">
      <p class="dd-kicker">T004 · Popular spot decision</p>
      <h1>先別急著衝爆紅景點。</h1>
      <p>把期待值、人潮、排隊和替代意願填進來，工具會直接告訴你：值得去、改時段去，還是把位置留給更適合你的地方。</p>
    </section>

    <section class="dd-tool">
      <section class="dd-inputs" aria-label="景點判斷輸入">
        <h2>1. 填入景點</h2>
        <label class="dd-field">
          <span>爆紅景點</span>
          <input data-place value="聖水洞熱門咖啡街">
        </label>
        <label class="dd-field">
          <span>你想要的是</span>
          <select data-goal>
            <option>拍照</option>
            <option>美食</option>
            <option>故事感</option>
            <option>放空</option>
          </select>
        </label>
        <label class="dd-slider">
          <span>期待值 <strong data-expectation-label>82</strong></span>
          <input data-expectation type="range" min="0" max="100" value="82">
          <small>只是好奇 / 真的很想去</small>
        </label>
        <label class="dd-slider">
          <span>人潮耐受 <strong data-crowd-label>36</strong></span>
          <input data-crowd type="range" min="0" max="100" value="36">
          <small>看到人就累 / 排隊也可以</small>
        </label>
        <label class="dd-slider">
          <span>排隊成本 <strong data-wait-label>70</strong></span>
          <input data-wait type="range" min="0" max="100" value="70">
          <small>幾乎不用等 / 很可能耗掉半天</small>
        </label>
        <label class="dd-slider">
          <span>替代意願 <strong data-detour-label>64</strong></span>
          <input data-detour type="range" min="0" max="100" value="64">
          <small>一定要原點 / 願意找同氛圍替代</small>
        </label>
        <button class="dd-button primary" data-calc>2. 判斷值得嗎</button>
      </section>

      <section class="dd-ticket" data-result aria-label="景點判斷結果"></section>
    </section>
  </main>

  <div class="dd-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/dupe-dream.js?v=20260525simple"></script>
</body>
</html>
