<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家族體力地圖｜ChillOut 旅行小工具 T024</title>
  <meta name="description" content="輸入長輩、小孩與同行者的體力、步行、午休與耐熱需求，生成家庭旅遊的上午、午後、晚間節奏表與 ChillOut 行程 prompt。">
  <meta property="og:title" content="家族體力地圖｜ChillOut">
  <meta property="og:description" content="家庭旅行不是景點越多越好，而是所有人都走得完、玩得開心。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/family-energy-map.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/family-energy-map.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/family-energy-map.html">
  <link rel="stylesheet" href="../assets/family-energy-map.css?v=20260525manual1">
</head>
<body class="fe-app">
  <header class="fe-topbar">
    <a class="fe-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="fe-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T024 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_family_energy_map_nav">下載 App</a>
    </nav>
  </header>

  <main class="fe-page">
    <section class="fe-hero">
      <p class="fe-eyebrow">Family energy map</p>
      <h1>家庭旅遊，先照顧最容易累的那個人。</h1>
      <p>長輩、小孩、年輕人想要的節奏通常不一樣。這個工具把每個人的體力、步行、午休、耐熱與照顧需求放在同一張表，幫主揪排出上午、午後、晚間的強弱節奏。</p>
    </section>

    <section class="fe-tool" aria-label="家族體力地圖操作區">
      <aside class="fe-settings">
        <form data-plan-form>
          <label class="fe-field">
            <span>旅行名稱</span>
            <input data-trip value="三代同堂關西行" autocomplete="off">
          </label>
          <div class="fe-two">
            <label class="fe-field">
              <span>天數</span>
              <input data-days type="number" min="1" max="14" value="4">
            </label>
            <label class="fe-field">
              <span>主要城市</span>
              <input data-city value="大阪、京都" autocomplete="off">
            </label>
          </div>
          <label class="fe-field">
            <span>這趟最重要的是</span>
            <select data-goal>
              <option value="comfort" selected>不要有人被拖垮</option>
              <option value="memory">留下漂亮回憶</option>
              <option value="food">吃得舒服</option>
              <option value="kids">小孩放電但不要崩潰</option>
            </select>
          </label>
          <label class="fe-range">
            <span>天氣壓力 <strong data-weather-value>58</strong></span>
            <input data-weather type="range" min="0" max="100" value="58">
          </label>
          <div class="fe-actions">
            <button type="button" class="fe-button" data-sample>載入示範</button>
            <button type="button" class="fe-button" data-add>加入成員</button>
          </div>
        </form>
        <div class="fe-note">
          <strong>使用方式</strong>
          <p>先列出同行成員，再調整每個人的體力條。分數不是醫療判斷，只是幫主揪把行程密度排得更貼近真實狀況。</p>
        </div>
      </aside>

      <section class="fe-workbench">
        <div class="fe-members-head">
          <div>
            <p class="fe-eyebrow">Travel party</p>
            <h2>同行成員體力表</h2>
          </div>
          <button type="button" class="fe-button fe-primary" data-generate>生成體力地圖</button>
        </div>
        <div class="fe-members" data-members></div>
      </section>

      <section class="fe-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="fe-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/family-energy-map.js?v=20260525manual1"></script>
</body>
</html>
