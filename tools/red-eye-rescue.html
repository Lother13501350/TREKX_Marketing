<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>紅眼航班救援包｜ChillOut 旅行小工具 T035</title>
  <meta name="description" content="輸入紅眼航班時間、行李狀態、住宿時間與疲勞敏感度，安排寄物、淋浴、咖啡、補眠、交通與早餐策略，生成可分享的紅眼航班救援計畫。">
  <meta property="og:title" content="紅眼航班救援包｜ChillOut 旅行小工具 T035">
  <meta property="og:description" content="紅眼航班需要的是緩衝，不是硬撐。把班機前後排成可執行的生存時間表。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/red-eye-rescue.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/red-eye-rescue.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/red-eye-rescue.html">
  <link rel="stylesheet" href="../assets/red-eye-rescue.css?v=20260525manual1">
</head>
<body class="rr-app">
  <header class="rr-nav">
    <a class="rr-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="rr-mark">C</span>
      <span><strong>ChillOut</strong><small>T035 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_red_eye_rescue_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="rr-hero">
      <div class="rr-hero-copy">
        <p class="rr-kicker">T035 · red-eye flight survival</p>
        <h1>紅眼航班不是行程空白，是需要被設計的恢復段。</h1>
        <p>這個工具會把班機、住宿、行李、補眠、淋浴、咖啡與交通排成一份救援包。目標不是塞更多景點，而是讓你不要在機場和街上狼狽漂流。</p>
      </div>
      <figure class="rr-visual">
        <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1100&q=80" alt="夜間機場候機空間">
      </figure>
    </section>

    <section class="rr-workbench" aria-label="紅眼航班救援包操作區">
      <aside class="rr-flight" aria-label="航班條件">
        <p class="rr-kicker">Flight conditions</p>
        <h2>班機條件</h2>
        <label>
          城市 / 機場
          <input data-city value="新加坡樟宜" placeholder="例如：東京羽田、首爾仁川、曼谷素萬那普">
        </label>
        <div class="rr-two">
          <label>
            模式
            <select data-mode>
              <option value="arrival">清晨抵達</option>
              <option value="departure">深夜出發</option>
            </select>
          </label>
          <label>
            班機時間
            <input data-flight-time type="time" value="05:35">
          </label>
        </div>
        <div class="rr-two">
          <label>
            住宿可進房
            <input data-room-time type="time" value="14:00">
          </label>
          <label>
            隔天第一件事
            <input data-first-thing value="11:30 會議 / 景點預約" placeholder="例如：10:00 集合、13:00 check-in">
          </label>
        </div>
        <label>
          行李狀態
          <select data-luggage>
            <option value="large">大行李箱</option>
            <option value="carry">登機箱</option>
            <option value="backpack">背包</option>
            <option value="none">幾乎無行李</option>
          </select>
        </label>
        <label class="rr-range">
          <span>疲勞敏感度 <strong data-fatigue-label>72/100</strong></span>
          <input data-fatigue type="range" min="1" max="100" value="72">
        </label>
        <label class="rr-check">
          <input data-shower type="checkbox" checked>
          <span>機場或住宿附近可淋浴</span>
        </label>
        <label class="rr-check">
          <input data-locker type="checkbox" checked>
          <span>可寄物或提早放行李</span>
        </label>
        <div class="rr-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-module>新增救援模組</button>
        </div>
      </aside>

      <section class="rr-modules" aria-label="救援模組">
        <div class="rr-module-head">
          <div>
            <p class="rr-kicker">Rescue modules</p>
            <h2>救援模組</h2>
          </div>
          <button type="button" class="rr-primary" data-generate>生成救援包</button>
        </div>
        <div class="rr-module-list" data-modules></div>
      </section>
    </section>

    <section class="rr-output" data-output aria-live="polite">
      <div class="rr-empty">
        <p class="rr-kicker">Result</p>
        <h2>先確認班機與救援模組，這裡會生成紅眼航班救援包。</h2>
        <p>結果會包含時間表、體力分配、不可硬撐清單、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="rr-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/red-eye-rescue.js?v=20260525manual1"></script>
</body>
</html>
