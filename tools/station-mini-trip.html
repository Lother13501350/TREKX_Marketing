<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>車站微旅行｜ChillOut 旅行小工具 T044</title>
  <meta name="description" content="只用一個車站周邊排出半天。輸入車站、可用時間、行李狀態、天氣與候選點，生成吃、逛、休息三段車站微旅行。">
  <meta property="og:title" content="車站微旅行｜ChillOut 旅行小工具 T044">
  <meta property="og:description" content="車站不是路過，它也能是一段旅行。把轉車和等人的空檔變成微旅行。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/station-mini-trip.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/station-mini-trip.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/station-mini-trip.html">
  <link rel="stylesheet" href="../assets/station-mini-trip.css?v=20260525manual1">
</head>
<body class="sm-app">
  <header class="sm-nav">
    <a class="sm-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="sm-mark">C</span>
      <span><strong>ChillOut</strong><small>T044 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_station_mini_trip_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="sm-hero">
      <div class="sm-hero-copy">
        <p class="sm-kicker">T044 · station micro trip</p>
        <h1>等車、轉車、等人，也可以是一段小旅行。</h1>
        <p>輸入你所在的車站和空檔時間，工具會用行李、天氣、步行距離與候選點，排出吃、逛、休息三段式微旅行，並提醒你什麼時候該回站。</p>
      </div>
      <figure class="sm-visual">
        <img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=1100&q=80" alt="車站與月台">
      </figure>
    </section>

    <section class="sm-workbench" aria-label="車站微旅行操作區">
      <aside class="sm-settings" aria-label="空檔條件">
        <p class="sm-kicker">Station settings</p>
        <h2>空檔條件</h2>
        <label>車站<input data-station value="台中車站" placeholder="例如：京都站、首爾站、高雄車站"></label>
        <div class="sm-two">
          <label>可用時間<select data-window><option value="45">45 分鐘</option><option value="90" selected>90 分鐘</option><option value="150">2.5 小時</option><option value="240">半天</option></select></label>
          <label>回站緩衝<select data-buffer><option value="10">10 分鐘</option><option value="15" selected>15 分鐘</option><option value="25">25 分鐘</option></select></label>
        </div>
        <label>行李狀態<select data-luggage><option value="large">大行李</option><option value="carry">登機箱</option><option value="light" selected>輕便背包</option><option value="none">無行李</option></select></label>
        <label class="sm-check"><input data-rain type="checkbox"><span>可能下雨，優先室內或有遮蔽</span></label>
        <label class="sm-range"><span>步行上限 <strong data-walk-label>14 分鐘</strong></span><input data-walk type="range" min="4" max="35" value="14"></label>
        <label class="sm-range"><span>探索慾望 <strong data-curiosity-label>66/100</strong></span><input data-curiosity type="range" min="1" max="100" value="66"></label>
        <div class="sm-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-stop>新增車站點</button>
        </div>
      </aside>

      <section class="sm-stops" aria-label="車站周邊候選點">
        <div class="sm-stop-head">
          <div><p class="sm-kicker">Station stops</p><h2>周邊候選點</h2></div>
          <button type="button" class="sm-primary" data-generate>生成微旅行</button>
        </div>
        <div class="sm-stop-list" data-stops></div>
      </section>
    </section>

    <section class="sm-output" data-output aria-live="polite">
      <div class="sm-empty">
        <p class="sm-kicker">Result</p>
        <h2>先放入車站周邊候選點，這裡會生成三段微旅行。</h2>
        <p>結果會包含吃、逛、休息、回站提醒、分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="sm-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/station-mini-trip.js?v=20260525manual1"></script>
</body>
</html>
