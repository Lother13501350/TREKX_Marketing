<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>餐廳否決權｜ChillOut 旅行小工具 T027</title>
  <meta name="description" content="整理多人旅行的忌口、想吃、辣度、預算與候選餐廳，輸出安全候選、否決規則、群組公告與 ChillOut 美食路線 prompt。">
  <meta property="og:title" content="餐廳否決權｜ChillOut">
  <meta property="og:description" content="每個人都有一次不想吃的權利，餐廳不是猜心遊戲，是共同規則。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/restaurant-veto.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/restaurant-veto.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/restaurant-veto.html">
  <link rel="stylesheet" href="../assets/restaurant-veto.css?v=20260525manual1">
</head>
<body class="rv-app">
  <header class="rv-topbar">
    <a class="rv-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="rv-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T027 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_restaurant_veto_nav">下載 App</a>
    </nav>
  </header>

  <main class="rv-page">
    <section class="rv-hero">
      <p class="rv-eyebrow">Restaurant veto board</p>
      <h1>多人吃飯，先把不能吃的講清楚。</h1>
      <p>旅行吃飯最怕有人一直說都可以，最後又默默不開心。這個工具把忌口、想吃、辣度、預算與候選餐廳放在同一張表，讓每個人都有一次合理否決權。</p>
    </section>

    <section class="rv-layout" aria-label="餐廳否決權操作區">
      <aside class="rv-panel rv-settings">
        <form data-meal-form>
          <label class="rv-field">
            <span>旅行餐局</span>
            <input data-trip value="首爾第二晚晚餐" autocomplete="off">
          </label>
          <div class="rv-two">
            <label class="rv-field">
              <span>用餐人數</span>
              <input data-count type="number" min="2" max="20" value="4">
            </label>
            <label class="rv-field">
              <span>否決規則</span>
              <select data-policy>
                <option value="one" selected>每人一次否決</option>
                <option value="allergy">忌口優先</option>
                <option value="majority">多數決</option>
              </select>
            </label>
          </div>
          <label class="rv-range">
            <span>群組飢餓風險 <strong data-hunger-value>58</strong></span>
            <input data-hunger type="range" min="0" max="100" value="58">
          </label>
          <div class="rv-actions">
            <button type="button" class="rv-button" data-sample>載入示範</button>
            <button type="button" class="rv-button" data-add-diner>加旅伴</button>
            <button type="button" class="rv-button" data-add-place>加餐廳</button>
          </div>
        </form>
      </aside>

      <section class="rv-panel rv-diners">
        <div class="rv-section-head">
          <div>
            <p class="rv-eyebrow">Diners</p>
            <h2>忌口與想吃</h2>
          </div>
        </div>
        <div class="rv-diner-list" data-diners></div>
      </section>

      <section class="rv-panel rv-places">
        <div class="rv-section-head">
          <div>
            <p class="rv-eyebrow">Candidates</p>
            <h2>候選餐廳</h2>
          </div>
          <button type="button" class="rv-button rv-primary" data-generate>生成否決表</button>
        </div>
        <div class="rv-place-list" data-places></div>
      </section>

      <section class="rv-panel rv-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="rv-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/restaurant-veto.js?v=20260525manual1"></script>
</body>
</html>
