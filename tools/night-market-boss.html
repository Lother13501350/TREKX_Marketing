<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜市點餐 Boss｜ChillOut 旅行小工具 T039</title>
  <meta name="description" content="輸入夜市、飢餓程度、排隊忍耐、辣度、預算與候選攤位，生成主食、飲料、甜點、遊戲與收尾的夜市點餐順序，導回 ChillOut 安排完整夜遊。">
  <meta property="og:title" content="夜市點餐 Boss｜ChillOut 旅行小工具 T039">
  <meta property="og:description" content="夜市不需要全吃，需要吃得有節奏。把點餐變成一場任務。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/night-market-boss.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/night-market-boss.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/night-market-boss.html">
  <link rel="stylesheet" href="../assets/night-market-boss.css?v=20260525manual1">
</head>
<body class="nb-app">
  <header class="nb-nav">
    <a class="nb-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="nb-mark">C</span>
      <span><strong>ChillOut</strong><small>T039 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_night_market_boss_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="nb-hero">
      <div class="nb-hero-copy">
        <p class="nb-kicker">T039 · night market order boss</p>
        <h1>夜市不要全吃，先排出一條不撐爆的點餐路線。</h1>
        <p>把候選攤位放進來，調整飢餓、預算、辣度與排隊忍耐。工具會決定先吃主食、何時買飲料、甜點怎麼收尾，還會留一個遊戲或散步段。</p>
      </div>
      <figure class="nb-visual">
        <img src="https://images.unsplash.com/photo-1532635224-cf024e66d122?auto=format&fit=crop&w=1100&q=80" alt="夜市攤位與街頭食物">
      </figure>
    </section>

    <section class="nb-workbench" aria-label="夜市點餐 Boss 操作區">
      <aside class="nb-settings" aria-label="點餐條件">
        <p class="nb-kicker">Order settings</p>
        <h2>今晚條件</h2>
        <label>
          夜市 / 區域
          <input data-market value="台南花園夜市" placeholder="例如：士林夜市、逢甲夜市、明洞街頭">
        </label>
        <div class="nb-two">
          <label>
            同行人數
            <input data-people type="number" min="1" max="12" value="3">
          </label>
          <label>
            人均預算
            <input data-budget type="number" min="100" max="3000" value="450">
          </label>
        </div>
        <label class="nb-range">
          <span>飢餓程度 <strong data-hunger-label>74/100</strong></span>
          <input data-hunger type="range" min="1" max="100" value="74">
        </label>
        <label class="nb-range">
          <span>排隊忍耐 <strong data-line-label>16 分鐘</strong></span>
          <input data-line type="range" min="0" max="45" value="16">
        </label>
        <label class="nb-range">
          <span>吃辣上限 <strong data-spice-label>46/100</strong></span>
          <input data-spice type="range" min="0" max="100" value="46">
        </label>
        <div class="nb-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-stall>新增攤位</button>
        </div>
      </aside>

      <section class="nb-stalls" aria-label="候選攤位">
        <div class="nb-stall-head">
          <div>
            <p class="nb-kicker">Candidate stalls</p>
            <h2>候選攤位</h2>
          </div>
          <button type="button" class="nb-primary" data-generate>生成點餐路線</button>
        </div>
        <div class="nb-stall-list" data-stalls></div>
      </section>
    </section>

    <section class="nb-output" data-output aria-live="polite">
      <div class="nb-empty">
        <p class="nb-kicker">Result</p>
        <h2>先放入候選攤位，這裡會生成夜市點餐任務。</h2>
        <p>結果會包含點餐順序、預算估算、排隊策略、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="nb-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/night-market-boss.js?v=20260525manual1"></script>
</body>
</html>
