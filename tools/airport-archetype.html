<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>機場人格測驗｜ChillOut 旅行小工具 T014</title>
  <meta name="description" content="用 8 個機場情境測出你的出發人格，產生登機前求生策略、候機節奏與可丟進 ChillOut 的出發日 prompt。">
  <meta property="og:title" content="機場人格測驗｜ChillOut">
  <meta property="og:description" content="機場已經暴露你整趟旅行的樣子。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/airport-archetype.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/airport-archetype.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/airport-archetype.html">
  <link rel="stylesheet" href="../assets/airport-archetype.css?v=20260525manual1">
</head>
<body class="airport-app">
  <header class="aa-topbar">
    <a class="aa-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="aa-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T014 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_airport_archetype_nav">下載 App</a>
    </nav>
  </header>

  <main class="aa-page">
    <section class="aa-hero">
      <p class="aa-eyebrow">Airport departure type</p>
      <h1>機場已經暴露你整趟旅行的樣子。</h1>
      <p>用 8 個出發情境測出你的機場人格。結果不是只給綽號，還會把你的候機節奏、焦慮來源、出發日行程密度轉成可以給 ChillOut 使用的 prompt。</p>
    </section>

    <section class="aa-gate" aria-label="機場人格測驗操作區">
      <form class="aa-form" data-form>
        <div class="aa-progress">
          <span data-progress-text>0 / 8 已選</span>
          <div><i data-progress-bar></i></div>
        </div>

        <fieldset class="aa-question">
          <legend>你會提前多久到機場？</legend>
          <button type="button" data-choice data-key="arrival" data-value="control">三小時起跳，越早越安心</button>
          <button type="button" data-choice data-key="arrival" data-value="flow">差不多就好，照建議時間</button>
          <button type="button" data-choice data-key="arrival" data-value="chaos">壓線也不是第一次</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>報到櫃台排隊時你在做什麼？</legend>
          <button type="button" data-choice data-key="checkin" data-value="control">重看證件和行李規定</button>
          <button type="button" data-choice data-key="checkin" data-value="social">幫大家拍出發照</button>
          <button type="button" data-choice data-key="checkin" data-value="comfort">先找最近的咖啡</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>過安檢前你最在意？</legend>
          <button type="button" data-choice data-key="security" data-value="control">液體、電腦、外套都先整理好</button>
          <button type="button" data-choice data-key="security" data-value="chaos">到前面才開始翻包</button>
          <button type="button" data-choice data-key="security" data-value="flow">跟著隊伍節奏走</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>免稅店對你來說是？</legend>
          <button type="button" data-choice data-key="dutyfree" data-value="social">補伴手禮和限動素材</button>
          <button type="button" data-choice data-key="dutyfree" data-value="comfort">看一下，但休息比較重要</button>
          <button type="button" data-choice data-key="dutyfree" data-value="control">先確認登機門再逛</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>登機門還沒開，你會？</legend>
          <button type="button" data-choice data-key="gate" data-value="comfort">坐好、充電、補水</button>
          <button type="button" data-choice data-key="gate" data-value="social">拍登機口或跟朋友聊天</button>
          <button type="button" data-choice data-key="gate" data-value="chaos">到處走，差點錯過廣播</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>航班延誤 40 分鐘，你第一反應？</legend>
          <button type="button" data-choice data-key="delay" data-value="control">立刻重算轉機與抵達時間</button>
          <button type="button" data-choice data-key="delay" data-value="comfort">剛好吃點東西休息</button>
          <button type="button" data-choice data-key="delay" data-value="chaos">反正旅行就是這樣</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>登機後你最想先做？</legend>
          <button type="button" data-choice data-key="boarding" data-value="control">整理座位、確認落地交通</button>
          <button type="button" data-choice data-key="boarding" data-value="comfort">戴耳機準備睡</button>
          <button type="button" data-choice data-key="boarding" data-value="social">拍窗景、發出發限動</button>
        </fieldset>

        <fieldset class="aa-question">
          <legend>落地後第一站你偏好？</legend>
          <button type="button" data-choice data-key="landing" data-value="control">先到住宿放行李</button>
          <button type="button" data-choice data-key="landing" data-value="comfort">先吃東西或咖啡</button>
          <button type="button" data-choice data-key="landing" data-value="social">直接去漂亮街區開拍</button>
        </fieldset>

        <div class="aa-actions">
          <button class="aa-button" type="button" data-sample>套用典型旅人</button>
          <button class="aa-button aa-primary" type="submit">產生登機人格</button>
        </div>
      </form>

      <section class="aa-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="aa-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/airport-archetype.js?v=20260525manual1"></script>
</body>
</html>
