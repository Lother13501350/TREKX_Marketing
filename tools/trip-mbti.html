<head>

  <meta property="og:title" content="旅行 MBTI 不是 MBTI｜ChillOut">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/trip-mbti.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/trip-mbti.svg">

  <link rel="stylesheet" href="../assets/trip-mbti.css?v=20260525manual1">
</head>
<body class="triptype-app">
  <header class="tm-topbar">
    <a class="tm-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="tm-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T011 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_trip_mbti_nav">下載 App</a>
    </nav>
  </header>

  <main class="tm-page">
    <section class="tm-hero">
      <p class="tm-eyebrow">Trip operating system</p>
      <h1>你不是難搞，只是旅行設定很明確。</h1>
      <p>四題測出你的旅行操作系統。結果不是心理學診斷，而是一張可以拿去跟旅伴溝通、也能丟進 ChillOut 生成行程的人格卡。</p>
    </section>

    <section class="tm-quiz" aria-label="旅行 MBTI 測驗操作區">
      <form class="tm-questions" data-form>
        <fieldset class="tm-question">
          <legend>旅行節奏</legend>
          <button type="button" data-choice data-key="pace" data-value="slow">慢慢晃，留空白</button>
          <button type="button" data-choice data-key="pace" data-value="dense">一天塞滿才安心</button>
        </fieldset>

        <fieldset class="tm-question">
          <legend>第一順位</legend>
          <button type="button" data-choice data-key="anchor" data-value="food">餐廳和咖啡先鎖定</button>
          <button type="button" data-choice data-key="anchor" data-value="scene">景點和街區先決定</button>
        </fieldset>

        <fieldset class="tm-question">
          <legend>臨時改行程</legend>
          <button type="button" data-choice data-key="flex" data-value="planned">可以改，但要有理由</button>
          <button type="button" data-choice data-key="flex" data-value="wild">越即興越像旅行</button>
        </fieldset>

        <fieldset class="tm-question">
          <legend>社交能量</legend>
          <button type="button" data-choice data-key="social" data-value="quiet">安靜探索比較充電</button>
          <button type="button" data-choice data-key="social" data-value="open">朋友一起玩才有趣</button>
        </fieldset>

        <div class="tm-actions">
          <button class="tm-button" type="button" data-random>隨機測一次</button>
          <button class="tm-button tm-primary" type="submit">產生人格卡</button>
        </div>
      </form>

      <section class="tm-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="tm-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/trip-mbti.js?v=20260525manual1"></script>
</body>
</html>
