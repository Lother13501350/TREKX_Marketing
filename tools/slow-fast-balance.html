<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慢旅快旅比例尺｜ChillOut 旅行小工具 T017</title>
  <meta name="description" content="用可用時間、體力、好奇心、移動厭惡與休息需求，算出一天該排幾個點才舒服。">
  <meta property="og:title" content="慢旅快旅比例尺｜ChillOut">
  <meta property="og:description" content="不是景點少，是你需要留白。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/slow-fast-balance.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/slow-fast-balance.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/slow-fast-balance.html">
  <link rel="stylesheet" href="../assets/slow-fast-balance.css?v=20260525manual1">
</head>
<body class="balance-app">
  <header class="sb-topbar">
    <a class="sb-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="sb-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T017 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_slow_fast_balance_nav">下載 App</a>
    </nav>
  </header>

  <main class="sb-page">
    <section class="sb-hero">
      <p class="sb-eyebrow">Slow / fast travel ratio</p>
      <h1>不是景點少，是你需要留白。</h1>
      <p>把旅行可用時間、體力、移動壓力和好奇心放進來，算出今天應該排幾個點、慢旅比例多少、哪幾段要留白。</p>
    </section>

    <section class="sb-tool" aria-label="慢旅快旅比例尺操作區">
      <form class="sb-form" data-form>
        <div class="sb-grid">
          <label class="sb-field">
            <span>城市 / 區域</span>
            <input data-city value="大阪" autocomplete="off">
          </label>
          <label class="sb-field">
            <span>可用時間</span>
            <select data-hours>
              <option value="5">5 小時</option>
              <option value="7" selected>7 小時</option>
              <option value="9">9 小時</option>
              <option value="11">11 小時</option>
            </select>
          </label>
        </div>

        <label class="sb-range">
          <span>今日體力 <strong data-value="energy">62</strong></span>
          <input data-energy type="range" min="0" max="100" value="62">
        </label>
        <label class="sb-range">
          <span>好奇心 <strong data-value="curiosity">74</strong></span>
          <input data-curiosity type="range" min="0" max="100" value="74">
        </label>
        <label class="sb-range">
          <span>討厭移動程度 <strong data-value="movement">66</strong></span>
          <input data-movement type="range" min="0" max="100" value="66">
        </label>
        <label class="sb-range">
          <span>需要休息程度 <strong data-value="rest">70</strong></span>
          <input data-rest type="range" min="0" max="100" value="70">
        </label>

        <div class="sb-grid">
          <label class="sb-field">
            <span>拍照需求</span>
            <select data-photo>
              <option value="low">不太拍</option>
              <option value="mid" selected>要有幾張</option>
              <option value="high">拍照是重點</option>
            </select>
          </label>
          <label class="sb-field">
            <span>餐廳錨點</span>
            <select data-food>
              <option value="none">沒有固定</option>
              <option value="one" selected>一餐要鎖</option>
              <option value="two">兩餐都重要</option>
            </select>
          </label>
        </div>

        <label class="sb-field">
          <span>旅伴狀態</span>
          <select data-party>
            <option value="solo">一個人</option>
            <option value="couple" selected>兩人</option>
            <option value="group">朋友小團</option>
            <option value="family">親子 / 長輩</option>
          </select>
        </label>

        <div class="sb-actions">
          <button class="sb-button" type="button" data-sample>載入示範</button>
          <button class="sb-button sb-primary" type="submit">計算比例</button>
        </div>
      </form>

      <section class="sb-result" data-result aria-live="polite"></section>
    </section>
  </main>

  <div class="sb-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/slow-fast-balance.js?v=20260525manual1"></script>
</body>
</html>
