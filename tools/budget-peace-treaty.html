<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>預算和平協議｜ChillOut 旅行小工具 T026</title>
  <meta name="description" content="輸入旅伴的每日舒適預算、最高上限與共同支出，生成旅行預算邊界、分帳規則、群組公告與 ChillOut prompt。">
  <meta property="og:title" content="預算和平協議｜ChillOut">
  <meta property="og:description" content="先談預算不是掃興，是讓大家玩得自在。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/budget-peace-treaty.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/budget-peace-treaty.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/budget-peace-treaty.html">
  <link rel="stylesheet" href="../assets/budget-peace-treaty.css?v=20260525manual1">
</head>
<body class="bt-app">
  <header class="bt-topbar">
    <a class="bt-brand" href="../travel-microtools-100.html" aria-label="回到 100 個旅行小工具">
      <span class="bt-logo">C</span>
      <span>
        <strong>ChillOut</strong>
        <small>T026 手寫版</small>
      </span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_budget_peace_treaty_nav">下載 App</a>
    </nav>
  </header>

  <main class="bt-page">
    <section class="bt-hero">
      <p class="bt-eyebrow">Budget peace treaty</p>
      <h1>把錢講清楚，旅行才不會變尷尬。</h1>
      <p>多人旅行最容易累積情緒的不是景點，而是有人覺得太貴、有人覺得掃興。這個工具把舒適預算、最高上限與共同支出整理成一份可以丟進群組的預算協議。</p>
    </section>

    <section class="bt-layout" aria-label="預算和平協議操作區">
      <aside class="bt-panel bt-settings">
        <form data-trip-form>
          <label class="bt-field">
            <span>旅行名稱</span>
            <input data-trip value="首爾四人週末" autocomplete="off">
          </label>
          <div class="bt-two">
            <label class="bt-field">
              <span>天數</span>
              <input data-days type="number" min="1" max="14" value="4">
            </label>
            <label class="bt-field">
              <span>幣別</span>
              <select data-currency>
                <option value="NT$" selected>NT$</option>
                <option value="JPY">JPY</option>
                <option value="KRW">KRW</option>
                <option value="USD">USD</option>
              </select>
            </label>
          </div>
          <label class="bt-range">
            <span>分帳敏感度 <strong data-sensitivity-value>64</strong></span>
            <input data-sensitivity type="range" min="0" max="100" value="64">
          </label>
          <div class="bt-actions">
            <button type="button" class="bt-button" data-sample>載入示範</button>
            <button type="button" class="bt-button" data-add-person>加旅伴</button>
            <button type="button" class="bt-button" data-add-expense>加支出</button>
          </div>
        </form>
        <div class="bt-note">
          <strong>使用方式</strong>
          <p>先填每個人的「舒服花」與「最多可接受」，再填共同支出。工具會用最低上限保護群組，不讓預算最緊的人被迫硬跟。</p>
        </div>
      </aside>

      <section class="bt-panel bt-people">
        <div class="bt-section-head">
          <div>
            <p class="bt-eyebrow">Travelers</p>
            <h2>旅伴預算邊界</h2>
          </div>
        </div>
        <div class="bt-people-list" data-people></div>
      </section>

      <section class="bt-panel bt-expenses">
        <div class="bt-section-head">
          <div>
            <p class="bt-eyebrow">Shared spend</p>
            <h2>共同支出估算</h2>
          </div>
          <button type="button" class="bt-button bt-primary" data-generate>生成協議</button>
        </div>
        <div class="bt-expense-list" data-expenses></div>
      </section>

      <section class="bt-panel bt-output" data-output aria-live="polite"></section>
    </section>
  </main>

  <div class="bt-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/budget-peace-treaty.js?v=20260525manual1"></script>
</body>
</html>
