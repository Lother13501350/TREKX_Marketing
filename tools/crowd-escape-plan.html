<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人潮逃生路線｜ChillOut 旅行小工具 T041</title>
  <meta name="description" content="熱門景點太擠時，輸入景點、人潮程度、可用時間與候選替代點，生成 15、30、60 分鐘逃生方案、分享文與 ChillOut prompt。">
  <meta property="og:title" content="人潮逃生路線｜ChillOut 旅行小工具 T041">
  <meta property="og:description" content="你可以去熱門地方，但不必困在熱門地方。立刻切出人潮備案。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/crowd-escape-plan.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/crowd-escape-plan.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/crowd-escape-plan.html">
  <link rel="stylesheet" href="../assets/crowd-escape-plan.css?v=20260525manual1">
</head>
<body class="ce-app">
  <header class="ce-nav">
    <a class="ce-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="ce-mark">C</span>
      <span><strong>ChillOut</strong><small>T041 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_crowd_escape_plan_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="ce-hero">
      <div class="ce-hero-copy">
        <p class="ce-kicker">T041 · crowd escape planner</p>
        <h1>熱門景點太擠，不代表今天就毀了。</h1>
        <p>把你卡住的景點、人潮程度、耐受度和附近備案放進來。工具會產出 15、30、60 分鐘三種逃生路線，讓你立刻從排隊模式切回旅行模式。</p>
      </div>
      <figure class="ce-visual">
        <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1100&q=80" alt="城市街道與人潮">
      </figure>
    </section>

    <section class="ce-workbench" aria-label="人潮逃生路線操作區">
      <aside class="ce-settings" aria-label="現場條件">
        <p class="ce-kicker">Crowd conditions</p>
        <h2>現場條件</h2>
        <label>
          目前卡住的景點
          <input data-place value="淺草雷門" placeholder="例如：清水寺、九份老街、明洞主街">
        </label>
        <label>
          所在區域
          <input data-area value="東京淺草" placeholder="例如：京都東山、台北中山、首爾弘大">
        </label>
        <div class="ce-two">
          <label>
            可用時間
            <select data-window>
              <option value="15">15 分鐘</option>
              <option value="30" selected>30 分鐘</option>
              <option value="60">60 分鐘</option>
              <option value="120">2 小時</option>
            </select>
          </label>
          <label>
            交通方式
            <select data-transport>
              <option value="walk">走路</option>
              <option value="metro">捷運 / 地鐵</option>
              <option value="bike">腳踏車</option>
              <option value="taxi">叫車</option>
            </select>
          </label>
        </div>
        <label class="ce-range">
          <span>現場人潮 <strong data-crowd-label>86/100</strong></span>
          <input data-crowd type="range" min="1" max="100" value="86">
        </label>
        <label class="ce-range">
          <span>人群耐受 <strong data-tolerance-label>32/100</strong></span>
          <input data-tolerance type="range" min="1" max="100" value="32">
        </label>
        <label class="ce-range">
          <span>預算彈性 <strong data-budget-label>44/100</strong></span>
          <input data-budget type="range" min="1" max="100" value="44">
        </label>
        <div class="ce-actions">
          <button type="button" data-sample>載入範例</button>
          <button type="button" data-add-option>新增備案</button>
        </div>
      </aside>

      <section class="ce-options" aria-label="附近備案">
        <div class="ce-option-head">
          <div>
            <p class="ce-kicker">Nearby options</p>
            <h2>附近備案</h2>
          </div>
          <button type="button" class="ce-primary" data-generate>生成逃生路線</button>
        </div>
        <div class="ce-option-list" data-options></div>
      </section>
    </section>

    <section class="ce-output" data-output aria-live="polite">
      <div class="ce-empty">
        <p class="ce-kicker">Result</p>
        <h2>先放入附近備案，這裡會生成三種逃生路線。</h2>
        <p>結果會包含 15、30、60 分鐘方案、群組公告、不要做的事與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="ce-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/crowd-escape-plan.js?v=20260525manual1"></script>
</body>
</html>
