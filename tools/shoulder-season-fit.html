<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>淡季適配測驗｜ChillOut 旅行小工具 T047</title>
  <meta name="description" content="T047 手寫版。輸入目的地、淡季月份、預算、人潮、天氣容忍與店休風險，判斷你適不適合淡季出發，並產生好天/壞天兩套玩法。">
  <meta property="og:title" content="淡季適配測驗｜ChillOut 旅行小工具 T047">
  <meta property="og:description" content="淡季不是便宜版旺季。用這個工具判斷你是淡季玩家、備案玩家，還是應該等旺季。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chillout-marketing-dashboard.vercel.app/tools/shoulder-season-fit.html">
  <meta property="og:image" content="https://chillout-marketing-dashboard.vercel.app/assets/tool-posters/shoulder-season-fit-manual.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://chillout-marketing-dashboard.vercel.app/tools/shoulder-season-fit.html">
  <link rel="stylesheet" href="../assets/shoulder-season-fit.css?v=20260525manual1">
</head>
<body class="sf-app">
  <header class="sf-nav">
    <a class="sf-brand" href="../travel-microtools-100.html" aria-label="回到 ChillOut 100 小工具">
      <span class="sf-mark">C</span>
      <span><strong>ChillOut</strong><small>T047 手寫版</small></span>
    </a>
    <nav aria-label="主要導覽">
      <a href="../travel-microtools-100.html">100 小工具</a>
      <a href="../microtools-commercial-rebuild-report.html">重做報告</a>
      <a href="https://apps.apple.com/tw/app/chillout/id6760571567?ct=tool_shoulder_season_fit_nav">下載 App</a>
    </nav>
  </header>

  <main>
    <section class="sf-hero">
      <div class="sf-copy">
        <p class="sf-kicker">T047 / Shoulder season fit</p>
        <h1>淡季不是便宜版旺季，是另一套旅行遊戲。</h1>
        <p>如果你怕天氣、怕店休、怕拍不到照片，淡季省下的錢可能會變成焦慮。這個工具把你的容忍度和目的地風險算清楚，決定要不要淡季出發。</p>
      </div>
      <figure class="sf-visual">
        <img src="../assets/tool-posters/shoulder-season-fit-manual.svg" alt="淡季適配測驗視覺">
      </figure>
    </section>

    <section class="sf-lab" aria-label="淡季條件設定">
      <aside class="sf-settings">
        <p class="sf-kicker">Season setup</p>
        <h2>先設定你要挑戰的淡季</h2>
        <label>目的地<input data-destination value="京都" placeholder="例如：京都、首爾、冰島、北海道"></label>
        <div class="sf-two">
          <label>出發月份
            <select data-month>
              <option value="march">3 月</option>
              <option value="april">4 月</option>
              <option value="may">5 月</option>
              <option value="september">9 月</option>
              <option value="october" selected>10 月</option>
              <option value="november">11 月</option>
            </select>
          </label>
          <label>旅行天數
            <select data-days>
              <option value="2">2 天</option>
              <option value="4" selected>4 天</option>
              <option value="6">6 天</option>
              <option value="8">8 天以上</option>
            </select>
          </label>
        </div>
        <label>目的地淡季風險
          <select data-season-risk>
            <option value="mild" selected>只是人少一點</option>
            <option value="weather">天氣不穩</option>
            <option value="closure">店休 / 景點縮短營業</option>
            <option value="remote">交通班次少</option>
          </select>
        </label>
        <label class="sf-range"><span>預算敏感 <strong data-budget-label>76/100</strong></span><input data-budget type="range" min="1" max="100" value="76"></label>
        <label class="sf-range"><span>怕人潮程度 <strong data-crowd-label>82/100</strong></span><input data-crowd type="range" min="1" max="100" value="82"></label>
        <label class="sf-range"><span>天氣容忍 <strong data-weather-label>58/100</strong></span><input data-weather type="range" min="1" max="100" value="58"></label>
        <label class="sf-range"><span>臨時改行程能力 <strong data-flex-label>64/100</strong></span><input data-flex type="range" min="1" max="100" value="64"></label>
        <div class="sf-actions">
          <button type="button" data-sample>帶入範例</button>
          <button type="button" class="sf-primary" data-generate>測出適配度</button>
        </div>
      </aside>

      <section class="sf-profile" aria-label="淡季偏好">
        <div class="sf-profile-head">
          <p class="sf-kicker">Travel contract</p>
          <h2>哪些東西不能犧牲？</h2>
        </div>
        <div class="sf-contracts">
          <label><input type="checkbox" data-contract="photo" checked><span><strong>照片與景色要漂亮</strong><small>如果霧、雨、枯枝太多會失望。</small></span></label>
          <label><input type="checkbox" data-contract="food" checked><span><strong>餐廳不能店休太多</strong><small>美食是主要目的，不想一直吃備案。</small></span></label>
          <label><input type="checkbox" data-contract="elder"><span><strong>同行者不適合受凍或淋雨</strong><small>有長輩、小孩或體力限制。</small></span></label>
          <label><input type="checkbox" data-contract="event"><span><strong>想碰運氣看活動或季節景</strong><small>願意為花況、楓況、祭典承擔不確定。</small></span></label>
          <label><input type="checkbox" data-contract="drive"><span><strong>可自駕或接受繞路</strong><small>交通少一點也能自己補救。</small></span></label>
          <label><input type="checkbox" data-contract="indoor"><span><strong>室內備案也能開心</strong><small>博物館、咖啡、書店可以撐住一整天。</small></span></label>
        </div>
      </section>
    </section>

    <section class="sf-output" data-output aria-live="polite">
      <div class="sf-empty">
        <p class="sf-kicker">Result</p>
        <h2>按下測驗後，這裡會產生淡季適配卡。</h2>
        <p>結果會包含適配分數、去/改/等的判斷、好天/壞天雙路線、訂房訂票規則、社群分享文與 ChillOut prompt。</p>
      </div>
    </section>
  </main>

  <div class="sf-toast" data-toast role="status" aria-live="polite"></div>
  <script src="../assets/shoulder-season-fit.js?v=20260525manual1"></script>
</body>
</html>
